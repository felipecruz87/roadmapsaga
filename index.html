    const id = pvId, a = b.dataset.pva; closePv();
    if (a === 'open') { UI.expanded.has(id) ? UI.expanded.delete(id) : UI.expanded.add(id); renderMain(); }
    else if (a === 'edit') openProjectModal(id);
    else if (a === 'log') openLog(id);
  });
}
document.addEventListener('pointerdown', e => { lastPT = e.pointerType || 'mouse'; if (pv && !pv.contains(e.target) && !e.target.closest('[data-pv]')) closePv(); }, true);
/* mouse: aparece ao parar sobre o projeto */
document.addEventListener('pointerover', e => {
  if (e.pointerType && e.pointerType !== 'mouse') return;
  if (pv && pv.contains(e.target)) { clearTimeout(pvHideT); return; }
  const t = e.target.closest && e.target.closest('[data-pv]');
  if (!t || modalEl || stPop || document.body.classList.contains('is-dragging')) return;
  if (pv && t.dataset.pv === pvId) { clearTimeout(pvHideT); return; }
  clearTimeout(pvOpenT);
  const x = e.clientX, y = e.clientY;
  pvOpenT = setTimeout(() => { if (t.isConnected) openPv(t, x, y); }, 450);
});
document.addEventListener('pointerout', e => {
  if (e.pointerType && e.pointerType !== 'mouse') return;
  const t = e.target.closest && e.target.closest('[data-pv]'); if (!t) return;
  const to = e.relatedTarget;
  if (to && to.closest && ((pv && pv.contains(to)) || (to.closest('[data-pv]') && to.closest('[data-pv]').dataset.pv === t.dataset.pv))) return;
  clearTimeout(pvOpenT);
  if (pv) { clearTimeout(pvHideT); pvHideT = setTimeout(closePv, 250); }
});
/* toque (celular/tablet/TV touch): abre com um toque; outro toque no mesmo projeto fecha */
document.addEventListener('click', e => {
  if (lastPT === 'mouse') return;
  if (pv && pv.contains(e.target)) return;
  const t = e.target.closest('[data-pv]'); if (!t) return;
  if (e.target.closest('[data-sp],.grip,.tgrip,input,select,textarea,a,.tag,[data-act]:not([data-act="toggle"])')) return;
  e.preventDefault(); e.stopPropagation();
  if (pv && pvId === t.dataset.pv) { closePv(); return; }
  openPv(t, e.clientX, e.clientY);
}, true);
window.addEventListener('scroll', e => { if (pv && !(e.target instanceof Node && pv.contains(e.target))) closePv(); }, true);
window.addEventListener('resize', () => closePv());

/* ---------- modo TV: trocar status tocando no status ---------- */
const spA = p => isAdmin() ? ` data-sp="${p.id}" title="Toque para mudar o status"` : '';
let stPop = null;
function closeStPop() { if (stPop) { stPop.remove(); stPop = null; return true; } return false; }
function openStPop(anchor) {
  closeStPop();
  const p = byId(anchor.dataset.sp); if (!p) return;
  stPop = document.createElement('div');
  stPop.className = 'st-pop'; stPop.setAttribute('role', 'menu');
  stPop.innerHTML = `<div class="st-pop-h">${esc(p.name)}</div>` + STATUS_ORDER.map(k => `<button role="menuitem" class="st-opt ${k === p.status ? 'on' : ''}" data-st="${k}" style="--s:${STATUS[k].color}"><i></i>${esc(STATUS[k].label)}</button>`).join('') +
    `<button class="st-opt new" data-st="__new">${I.plus}Novo status…</button>`;
  document.body.appendChild(stPop);
  const r = anchor.getBoundingClientRect(), pr = stPop.getBoundingClientRect(), m = 8;
  let top = r.bottom + 6; if (top + pr.height > innerHeight - m) top = Math.max(m, r.top - pr.height - 6);
  let left = r.left + r.width / 2 - pr.width / 2; left = Math.max(m, Math.min(innerWidth - pr.width - m, left));
  stPop.style.top = top + 'px'; stPop.style.left = left + 'px';
  stPop.addEventListener('click', e => {
    const b = e.target.closest('[data-st]'); if (!b) return;
    e.stopPropagation();
    let v = b.dataset.st;
    if (v === '__new') { v = newStatus(); if (!v) return; }
    closeStPop();
    if (v !== p.status) { setStatus(p, v, false); save(); tvPaint(false); toast(`${p.name}: ${STATUS[v].label}`); }
  });
}
document.addEventListener('click', e => {
  if (stPop && !stPop.contains(e.target)) { const keep = e.target.closest('[data-sp]'); closeStPop(); if (!keep) return; }
  const a = e.target.closest('[data-sp]');
  if (a && UI.tv && isAdmin()) { e.preventDefault(); e.stopPropagation(); openStPop(a); }
}, true);
window.addEventListener('resize', closeStPop);

/* ---------- modo TV: linha do tempo ---------- */
const TLS_KEY = 'saga_roadmap_tlstyle';
const TL_STYLES = [['faixas', 'Faixas'], ['gantt', 'Gantt'], ['meses', 'Por mês']];
const tlStyle = () => { const v = LS.get(TLS_KEY); return TL_STYLES.some(s => s[0] === v) ? v : 'faixas'; };
const DAY = 86400000;
const dms = iso => new Date(iso + 'T00:00:00').getTime();
const midnight = ts => { const d = new Date(ts); return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime(); };
const MONTHS = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
function tlSpan(p) {
  let s = p.start ? dms(p.start) : (p.createdAt ? midnight(p.createdAt) : null);
  let e = p.due ? dms(p.due) : (p.status === 'concluido' && p.doneAt ? midnight(p.doneAt) : null);
  if (s == null && e == null) return null;
  if (s == null) s = e; if (e == null) e = s; if (e < s) [s, e] = [e, s];
  return { s, e: e + DAY };
}
function tlRange(ps) {
  const today = midnight(Date.now());
  let min = today, max = today + DAY;
  ps.forEach(p => { const sp = tlSpan(p); if (sp) { min = Math.min(min, sp.s); max = Math.max(max, sp.e); } });
  if (max - min < 42 * DAY) max = min + 42 * DAY;
  const pad = (max - min) * 0.025; min -= pad; max += pad;
  const r = { min, max, span: max - min, today };
  r.x = t => Math.max(0, Math.min(100, (t - min) / r.span * 100));
  return r;
}
function tlGroups() {
  return orderedGroups().map(g => ({ g, ps: prioSort(DB.projects.filter(p => p.groupId === g.id)) })).filter(x => x.ps.length);
}
/* cabeçalho de meses e semanas + linhas de grade e "hoje" */
function tlAxis(r) {
  let mons = '', wks = '', grid = '';
  const d0 = new Date(r.min); let m = new Date(d0.getFullYear(), d0.getMonth(), 1);
  let i = 0;
  while (m.getTime() < r.max) {
    const nx = new Date(m.getFullYear(), m.getMonth() + 1, 1);
    const a = r.x(Math.max(m.getTime(), r.min)), b = r.x(Math.min(nx.getTime(), r.max));
    if (b - a > 0.5) mons += `<div class="tl-mon ${i % 2 ? 'alt' : ''}" style="left:${a}%;width:${b - a}%"><span${b - a < 6 ? ' hidden' : ''}>${MONTHS[m.getMonth()]}${m.getFullYear() !== new Date().getFullYear() ? ' ' + m.getFullYear() : ''}</span></div>`;
    if (m.getTime() > r.min) grid += `<i class="tl-gl m" style="left:${r.x(m.getTime())}%"></i>`;
    m = nx; i++;
  }
  const days = r.span / DAY;
  if (days <= 130) {
    let w = new Date(r.min); w = new Date(w.getFullYear(), w.getMonth(), w.getDate() + ((8 - w.getDay()) % 7));
    const step = days > 80 ? 14 : 7;
    while (w.getTime() < r.max) {
      const x = r.x(w.getTime());
      if (x > 2 && x < 98) { wks += `<span class="tl-wk" style="left:${x}%">${pad2(w.getDate())}/${pad2(w.getMonth() + 1)}</span>`; grid += `<i class="tl-gl" style="left:${x}%"></i>`; }
      w = new Date(w.getFullYear(), w.getMonth(), w.getDate() + step);
    }
  }
  const xt = r.x(r.today + DAY / 2);
  grid += `<i class="tl-today" style="left:${xt}%"></i>`;
  wks = wks.replace(/<span class="tl-wk" style="left:([\d.]+)%">[^<]*<\/span>/g, (m0, x) => Math.abs(+x - xt) < 4.5 ? '' : m0);
  return { head: `<div class="tl-axis">${mons}${wks}<span class="tl-tlab" style="left:${xt}%">Hoje ${fmtD(r.today)}</span></div>`, grid };
}
function renderTVTimeline() {
  app.innerHTML = `<div class="tv" id="tv">
    <header class="tv-top">
      <div class="tv-brand"><span class="tv-logo">${LOGO_SVG}</span><span class="tv-sep"></span><div><div class="tv-title">${esc(DB.settings.title)}</div><div class="tv-sub" id="tvSub"></div></div></div>
      <div class="tv-clock"><div class="tv-time" id="tvTime"></div><div class="tv-date" id="tvDate"></div></div>
    </header>
    <div class="tl-wrap" id="tlWrap"></div>
    <footer class="tv-legend" id="tvLegend"></footer>
    <div class="tv-controls">${tvLayoutBtn()}
      <button class="btn" data-act="tlstyle" title="Trocar o estilo da linha do tempo">${I.rotate}<span>Estilo: ${TL_STYLES.find(s => s[0] === tlStyle())[1]}</span></button>
      <button class="btn" data-act="fs" title="Tela cheia">${I.expand}</button>
      <button class="btn" data-act="tvexit">${I.x}<span>Sair</span></button>
    </div>
  </div>`;
  tvControls($('#tv')); paintTimeline(); tvClock();
  if (!tvTimer) { tvSec = 0; tvTimer = setInterval(tvTick, 1000); }
}
function paintTimeline() {
  const wrap = $('#tlWrap'); if (!wrap) return;
  const st = tlStyle();
  if (st === 'gantt') paintGantt(wrap); else if (st === 'meses') paintMeses(wrap); else paintFaixas(wrap);
  const all = DB.projects;
  $('#tvSub').textContent = `${all.length} projetos · progresso geral ${progressOf(all)}%`;
  $('#tvLegend').innerHTML = tvPrioSummary(all) + tvDueSummary(all) + STATUS_ORDER.map(s => { const n = all.filter(p => p.status === s).length; return n ? `<span class="pill" style="--s:${STATUS[s].color}">${esc(STATUS[s].label)} · ${n}</span>` : ''; }).join('') +
    `<span class="upd">Atualizado em ${fmtStamp(DB.updatedAt)}</span>`;
}
const clampN = (v, a, b) => Math.max(a, Math.min(b, v));

/* Estilo 1 — Faixas: uma faixa por categoria, projetos como setas do início ao prazo */
function paintFaixas(wrap) {
  const groups = tlGroups(), r = tlRange(DB.projects), ax = tlAxis(r);
  const W = wrap.clientWidth, H = wrap.clientHeight, LW = 0.15, ROW = 1.85;
  const trackPx = W * (1 - LW);
  let fs = 18, lanes = [];
  for (let it = 0; it < 4; it++) {
    const trackEm = trackPx / fs;
    lanes = groups.map(({ g, ps }) => {
      const rows = [], items = [];
      ps.map(p => ({ p, sp: tlSpan(p) })).filter(o => o.sp).sort((a, b) => (isPrio(b.p) - isPrio(a.p)) || a.sp.s - b.sp.s).forEach(({ p, sp }) => {
        const xs = r.x(sp.s), xe = r.x(sp.e), st = STATUS[p.status];
        const labelEm = (p.name.length + st.label.length * 0.8 + 5) * 0.47 + 1.4;
        const lw = labelEm / trackEm * 100, inside = xe - xs >= lw;
        const late = isLate(p);
        let end = inside ? xe : xe + lw; if (late) end = Math.max(end, r.x(r.today + DAY));
        let row = rows.findIndex(e => e + 0.5 <= xs); if (row < 0) { row = rows.length; rows.push(0); }
        rows[row] = end;
        items.push({ p, xs, xe, inside, late, row });
      });
      return { g, ps, items, n: Math.max(1, rows.length), undated: ps.length - items.length };
    });
    const totalEm = 3.3 + lanes.reduce((a, l) => a + Math.max(l.n * ROW + 0.7, 3.2), 0);
    fs = clampN(H / totalEm, 8, 30);
  }
  const lanesHTML = lanes.map(l => {
    const gp = progressOf(l.ps);
    return `<div class="tl-lane" style="--g:${l.g.color};flex:${Math.max(l.n * ROW + 0.7, 3.2)} 1 0">
      <div class="tl-lane-l"><b>${esc(l.g.name)}</b><span>${l.ps.length} proj. · ${gp}%${l.undated ? ` · ${l.undated} sem datas` : ''}</span></div>
      <div class="tl-track">${l.items.map(o => {
        const st = STATUS[o.p.status], pp = progress(o.p), done = o.p.status === 'concluido';
        const lbl = `<span data-pv="${o.p.id}" class="tl-lbl ${o.inside ? '' : 'out'}" style="left:${o.inside ? o.xs : o.xe}%"><span class="sd" style="--s:${st.color}"></span>${rcDot(o.p)}${esc(o.p.name)}${prioB(o.p)}<small><span class="tl-st"${spA(o.p)}>${esc(st.label)}</span> · ${pp}%${o.late ? ' · <em>atrasado</em>' : ''}</small></span>`;
        return `<div class="tl-it ${done ? 'done' : ''} ${isPrio(o.p) ? 'prio' : ''}" style="top:calc(.35em + ${o.row * ROW}em);--g:${colorOf(o.p)}">
          ${o.late ? `<i class="tl-late" style="left:${o.xe}%;width:${Math.max(0, r.x(r.today + DAY) - o.xe)}%"></i>` : ''}
          <div data-pv="${o.p.id}" class="tl-arrow" style="left:${o.xs}%;width:${Math.max(o.xe - o.xs, 0.8)}%"><i style="width:${pp}%"></i></div>${lbl}</div>`;
      }).join('')}</div></div>`;
  }).join('');
  wrap.innerHTML = `<div class="tl tl-faixas" style="font-size:${fs}px;--lw:${LW * 100}%">
    <div class="tl-head"><div></div>${ax.head}</div>
    <div class="tl-body"><div class="tl-grid">${ax.grid}</div>${lanesHTML}</div></div>`;
}

/* Estilo 2 — Gantt: uma linha por projeto, nome à esquerda e barra no tempo */
function paintGantt(wrap) {
  const groups = tlGroups(), r = tlRange(DB.projects), ax = tlAxis(r);
  const H = wrap.clientHeight, LW = 0.27;
  const nRows = groups.length * 1.25 + groups.reduce((a, x) => a + x.ps.length, 0) * 1.6;
  const fs = clampN(H / (3.3 + nRows), 8, 28);
  const rows = groups.map(({ g, ps }) => {
    const gp = progressOf(ps);
    return `<div class="tl-row cat" style="--g:${g.color};flex:1.25 1 0"><div class="tl-n"><span class="dot"></span><b>${esc(g.name)}</b><span class="c">${gp}%</span></div><div></div></div>` +
      ps.map(p => {
        const sp = tlSpan(p), st = STATUS[p.status], pp = progress(p), di = dateInfo(p), late = isLate(p);
        let bar = '<span class="tl-glbl" style="left:0">sem datas</span>';
        if (sp) {
          const xs = r.x(sp.s), xe = r.x(sp.e), txt = `${pp}%${di.text ? ' · ' + di.text : ''}`;
          const pos = late ? `left:${Math.max(xe, r.x(r.today + DAY))}%;padding-left:.6em` : xe < 76 ? `left:${xe}%` : xs > 24 ? `right:${100 - xs}%;padding:0 .5em 0 0` : `right:${100 - xe}%;padding:0 .7em 0 0;z-index:2`;
          bar = `${late ? `<i class="tl-late" style="left:${xe}%;width:${Math.max(0, r.x(r.today + DAY) - xe)}%"></i>` : ''}<div class="tl-gbar ${late ? 'late' : ''}" style="left:${xs}%;width:${Math.max(xe - xs, 0.8)}%"><i style="width:${pp}%"></i></div><span class="tl-glbl ${di.cls}" style="${pos}">${txt}</span>`;
        }
        return `<div data-pv="${p.id}" class="tl-row ${isPrio(p) ? 'prio' : ''}" style="--g:${colorOf(p)};flex:1.6 1 0"><div class="tl-n"><span class="nm">${rcDot(p)}${p.id === DB.featuredId ? I.starFill : ''}${esc(p.name)}</span>${prioB(p)}<span class="pill"${spA(p)} style="--s:${st.color}">${esc(st.label)}</span></div><div class="tl-track">${bar}</div></div>`;
      }).join('');
  }).join('');
  wrap.innerHTML = `<div class="tl tl-gantt" style="font-size:${fs}px;--lw:${LW * 100}%">
    <div class="tl-head"><div></div>${ax.head}</div>
    <div class="tl-body"><div class="tl-grid">${ax.grid}</div>${rows}</div></div>`;
}

/* Estilo 3 — Por mês: colunas com os projetos pelo mês do prazo */
function paintMeses(wrap) {
  const now = new Date(), cur = now.getFullYear() * 12 + now.getMonth();
  const cols = new Map(); const add = (k, p) => { if (!cols.has(k)) cols.set(k, []); cols.get(k).push(p); };
  let maxK = cur + 1;
  DB.projects.forEach(p => {
    if (p.status === 'concluido') {
      const ref = p.doneAt ? new Date(p.doneAt) : (p.due ? new Date(dms(p.due)) : now);
      add(Math.max(cur, ref.getFullYear() * 12 + ref.getMonth()), p); return;
    }
    if (!p.due) return add('none', p);
    if (isLate(p)) return add('late', p);
    const d = new Date(dms(p.due)), k = d.getFullYear() * 12 + d.getMonth();
    maxK = Math.max(maxK, k); add(k, p);
  });
  const keys = [];
  if (cols.has('late')) keys.push('late');
  for (let k = cur; k <= maxK; k++) keys.push(k);
  if (cols.has('none')) keys.push('none');
  const order = new Map(orderedGroups().map((g, i) => [g.id, i]));
  const html = keys.map(k => {
    const ps = (cols.get(k) || []).slice().sort((a, b) => (isPrio(b) - isPrio(a)) || (a.due || '9').localeCompare(b.due || '9') || order.get(a.groupId) - order.get(b.groupId));
    const title = k === 'late' ? 'Atrasados' : k === 'none' ? 'Sem prazo' : MONTHS[k % 12] + (Math.floor(k / 12) !== now.getFullYear() ? ' ' + Math.floor(k / 12) : '');
    const sub = k === cur ? 'mês atual' : ps.length ? `${ps.length} ${ps.length === 1 ? 'projeto' : 'projetos'}` : '';
    return `<section class="tl-col ${k === 'late' ? 'late' : ''} ${k === cur ? 'cur' : ''}" style="flex:${Math.max(1, Math.sqrt(ps.length))} 1 0">
      <div class="tl-col-h"><b>${title}</b><span>${k === cur && ps.length ? ps.length + ' · ' : ''}${sub}</span></div>
      <div class="tl-col-b">${ps.length ? ps.map(p => {
        const st = STATUS[p.status], pp = progress(p), di = dateInfo(p), g = groupOf(p);
        return `<div data-pv="${p.id}" class="tl-card ${isPrio(p) ? 'prio' : ''}" style="--g:${colorOf(p)}"><div class="n">${rcDot(p)}${p.id === DB.featuredId ? I.starFill : ''}${esc(p.name)}${prioB(p)}</div>
          <div class="g">${esc(g.name)}</div>
          <div class="m"><span class="pill"${spA(p)} style="--s:${st.color}">${esc(st.label)}</span><span class="${di.cls}">${p.status === 'concluido' ? di.text : p.due ? fmtD(p.due) : ''}</span></div>
          <div class="p"><div class="bar ${pp === 100 ? 'done' : ''}"><i style="width:${pp}%"></i></div><b>${pp}%</b></div></div>`;
      }).join('') : '<p class="tl-empty">Nada previsto</p>'}</div></section>`;
  }).join('');
  wrap.innerHTML = `<div class="tl tl-meses"><div class="tl-cols">${html}</div></div>`;
  const tl = wrap.firstChild, bodies = [...tl.querySelectorAll('.tl-col-b')];
  const fits = () => bodies.every(b => b.scrollHeight <= b.clientHeight + 1 && b.scrollWidth <= b.clientWidth + 1);
  let lo = 7, hi = 30;
  tl.style.fontSize = lo + 'px';
  if (fits()) { while (hi - lo > 0.25) { const mid = (lo + hi) / 2; tl.style.fontSize = mid + 'px'; if (fits()) lo = mid; else hi = mid; } }
  tl.style.fontSize = lo + 'px';
}

setInterval(() => { // tela principal: atualiza o sinal de alteração recente a cada minuto
  if (!ME || UI.tv || modalEl || !recentHours()) return;
  const a = document.activeElement; if (a && a.closest && a.closest('#main') && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) return;
  renderMain();
}, 60000);
/* ---------- início ---------- */
document.title = DB.settings.title;
if (!LS.get(KEY)) { if (!DB.updatedAt) DB.updatedAt = Date.now(); LS.set(KEY, JSON.stringify(DB)); }
restoreSession();
if (ME && location.hash === '#tv') UI.tv = true;
render();
if (UI.tv) requestWake();
pullRemote();
