<style>
:root{
  --bg:#f3f5f9; --surface:#ffffff; --surface-2:#f0f3f8; --text:#0f1729; --muted:#5d6779;
  --line:#e1e6ee; --line-2:#c9d1dd; --accent:#1d5fd6; --accent-2:#e8f0ff;
  --shadow:0 1px 2px rgba(15,23,41,.05),0 6px 18px rgba(15,23,41,.05); --logo:#1f83be;
  --r:14px; --font:"Inter","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0a0f1a; --surface:#111827; --surface-2:#182134; --text:#e7ecf5; --muted:#94a0b6;
  --line:#222d42; --line-2:#33405a; --accent:#5b93ff; --accent-2:#16233d;
  --shadow:0 1px 2px rgba(0,0,0,.35); --logo:#ffffff; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.45 var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;min-height:100dvh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
svg{width:18px;height:18px;flex:none}
.wrap{max-width:1680px;margin:0 auto;padding:0 16px}
@media(min-width:900px){.wrap{padding:0 28px}}
.muted{color:var(--muted)}
.hide{display:none!important}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 14px;border:1px solid var(--line);background:var(--surface);border-radius:10px;font-weight:600;font-size:14px;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--line-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:#dc2626}
.btn.mini{height:32px;padding:0 10px;font-size:13px;border-radius:8px}
.btn.block{width:100%;height:46px}
.icon-btn{display:inline-grid;place-items:center;width:40px;height:40px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0}
.icon-btn.sm{width:30px;height:30px;border-radius:8px}
.icon-btn.sm svg{width:15px;height:15px}
.icon-btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.icon-btn.ghost:hover{background:var(--surface-2);color:var(--text)}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.topbar-in{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:64px;padding-top:max(0px,env(safe-area-inset-top))}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{display:grid;place-items:center;width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#1d5fd6,#0ea5e9);color:#fff;font-weight:800;font-size:18px;flex:none;letter-spacing:-.02em}
.brand-title{font-weight:750;font-size:17px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-txt{min-width:0}
.brand-logo{display:block;color:var(--logo);flex:none;line-height:0}
.brand-logo svg{height:36px;width:auto}
.brand-sep{width:1px;align-self:stretch;margin:14px 2px;background:var(--line-2);flex:none}
@media(max-width:640px){.brand-logo svg{height:30px}}
.login-logo{display:block;color:var(--logo);line-height:0;margin-bottom:20px}
.login-logo svg{height:58px;width:auto}
.tv-logo{display:block;color:#fff;line-height:0;flex:none}
.tv-logo svg{height:2.7em;width:auto}
.tv-brand .tv-sep{width:1px;align-self:stretch;background:rgba(255,255,255,.18);margin:.25em .1em}
.top-actions{display:flex;align-items:center;gap:8px}
.user-chip{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 10px 0 4px;border:1px solid var(--line);background:var(--surface);border-radius:999px}
.avatar{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--accent-2);color:var(--accent);font-weight:700;font-size:12px}
@media(max-width:640px){.topbar{position:static}.topbar-in{flex-wrap:wrap;padding-top:max(10px,env(safe-area-inset-top));padding-bottom:10px;gap:10px}.brand{flex:1 1 100%}.top-actions{flex:1 1 100%;justify-content:flex-end}.top-actions .lbl{display:none}.btn.primary{padding:0 11px}.user-chip{padding:0 8px 0 4px}}

.viewonly{margin-top:14px;padding:9px 14px;border-radius:10px;background:var(--accent-2);color:var(--accent);font-size:13px;font-weight:600}

/* ---------- summary ---------- */
.summary{display:flex;align-items:center;gap:16px;margin:14px 0 10px;padding:8px 14px 8px 10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.sum-prog{display:flex;align-items:center;gap:10px;flex:none}
.sum-ring{--v:0;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--accent) calc(var(--v) * 1%),var(--surface-2) 0);position:relative;flex:none}
.sum-ring.done{background:conic-gradient(#16a34a 100%,transparent 0)}
.sum-ring::before{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--surface)}
.sum-ring span{position:relative;font-size:14px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.sum-ring small{font-size:10px;font-weight:700;margin-left:1px;color:var(--muted)}
.sum-k{font-size:13px;font-weight:700;line-height:1.2}
.sum-s{font-size:12px;color:var(--muted);white-space:nowrap}
.sum-sep{width:1px;align-self:stretch;background:var(--line);flex:none}
.sum-chips{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px}
.sc{--s:#64748b;display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 4px 0 10px;border-radius:999px;border:1px solid transparent;background:transparent;color:var(--text);font-size:12.5px;font-weight:600;white-space:nowrap;transition:background .15s,border-color .15s}
.sc:hover{background:var(--surface-2)}
.sc i{width:8px;height:8px;border-radius:50%;background:var(--s);flex:none}
.sc b{min-width:22px;height:20px;padding:0 6px;border-radius:999px;display:inline-grid;place-items:center;background:color-mix(in srgb,var(--s) 16%,transparent);color:var(--s);font-size:11.5px;font-weight:800;font-variant-numeric:tabular-nums}
:root[data-theme="dark"] .sc b{color:color-mix(in srgb,var(--s) 65%,#fff)}
.sc.on{border-color:var(--s);background:color-mix(in srgb,var(--s) 12%,transparent)}
.sc.prio{color:#dc2626;font-weight:750}
:root[data-theme="dark"] .sc.prio{color:#f87171}
.sc-sep{width:1px;height:18px;background:var(--line-2);margin:0 2px}
@media(max-width:760px){
  .summary{flex-direction:column;align-items:stretch;gap:8px;padding:10px 12px}
  .sum-sep{display:none}
  .sum-chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -12px;padding:0 12px 2px}
  .sum-chips::-webkit-scrollbar{display:none}
}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow)}
.stat-k{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.stat-v{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin:4px 0 8px;font-variant-numeric:tabular-nums}
.stat-s{font-size:12.5px;color:var(--muted);margin-top:8px}
.status-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}

/* ---------- pills / tags / bars ---------- */
.pill{--s:#64748b;display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-weight:650;font-size:12px;line-height:1.5;color:var(--s);background:color-mix(in srgb,var(--s) 14%,transparent);white-space:nowrap;border:1px solid transparent}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--s);flex:none}
:root[data-theme="dark"] .pill{color:color-mix(in srgb,var(--s) 70%,#fff)}
button.pill{cursor:pointer;font-family:inherit}
button.pill b{font-weight:800;margin-left:2px}
button.pill.on{border-color:var(--s);background:color-mix(in srgb,var(--s) 24%,transparent)}
.tag{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
button.tag{cursor:pointer}
button.tag.on{background:var(--accent);border-color:var(--accent);color:#fff}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;flex:1;min-width:40px}
.bar i{display:block;height:100%;width:0;background:var(--g,var(--accent));border-radius:inherit;transition:width .45s cubic-bezier(.2,.7,.2,1)}
.bar.done i{background:#16a34a}

/* ---------- toolbar ---------- */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.search{flex:1;min-width:220px;display:flex;align-items:center;gap:8px;height:38px;padding:0 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;color:var(--muted)}
.search input{flex:1;border:0;background:none;outline:none;height:100%;color:var(--text);min-width:0}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{height:30px;padding:0 12px;border:0;background:none;border-radius:7px;font-weight:600;font-size:13.5px;color:var(--muted)}
.seg button.on{background:var(--accent-2);color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:5px;align-items:center;flex:1;min-width:0}
.chips-row{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.chips-row .seg{flex:none;margin-left:auto}
.sum-dyn{display:contents}
.sum-search{flex:0 1 250px;min-width:170px;height:34px;padding:0 10px;border-radius:999px;background:var(--surface-2);border-color:transparent}
.sum-search:focus-within{border-color:var(--accent);background:var(--surface)}
.sum-search svg{width:16px;height:16px}
.sum-search input{font-size:13.5px}
@media(max-width:760px){
  .sum-search{flex:none;width:100%;min-width:0;height:38px}
  .sum-sep-s{display:none}
  .chips-row{flex-direction:column-reverse;align-items:stretch;gap:8px}
  .chips-row .seg{margin-left:0;align-self:flex-start}
}
.chips-k{font-size:12px;color:var(--muted);font-weight:600;margin-right:4px}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:600;font-size:13px;padding:2px 6px}

/* ---------- hero ---------- */
.hero{--g:#1d5fd6;position:relative;display:grid;grid-template-columns:minmax(0,1fr);gap:18px 28px;background:linear-gradient(135deg,color-mix(in srgb,var(--g) 16%,var(--surface)) 0%,var(--surface) 70%);border:1px solid color-mix(in srgb,var(--g) 30%,var(--line));border-radius:18px;padding:20px;margin-bottom:22px;box-shadow:var(--shadow)}
@media(min-width:860px){.hero{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);padding:26px 28px}}
.hero-k{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--g)}
.hero-k svg{width:15px;height:15px;fill:currentColor}
.hero-name{font-size:clamp(24px,3.2vw,38px);font-weight:800;letter-spacing:-.025em;line-height:1.08;margin:8px 0 10px}
.hero-meta{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;color:var(--muted);font-size:13.5px}
.hero-desc{color:var(--muted);margin:12px 0 0;max-width:60ch}
.hero-prog{display:flex;align-items:center;gap:14px;margin-top:18px}
.hero-prog .bar{height:12px}
.hero-pct{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.hero .tasks{background:color-mix(in srgb,var(--surface) 70%,transparent);border:1px solid var(--line);border-radius:12px;padding:6px}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hero-actions{display:flex;gap:6px}

/* ---------- groups ---------- */
.groups{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(min(100%,380px),1fr));align-items:start}
.group{--g:#64748b;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.group-head{padding:14px 14px 12px 16px;border-top:4px solid var(--g)}
.group-row{display:flex;align-items:center;gap:8px}
.group-name{flex:1;min-width:0;display:flex;align-items:center;gap:10px;border:0;background:none;padding:0;text-align:left;font-weight:750;font-size:16px;letter-spacing:-.01em}
.group-name .dot{width:10px;height:10px;border-radius:3px;background:var(--g);flex:none}
.group-name .chev{color:var(--muted);transition:transform .2s}
.group.collapsed .chev{transform:rotate(-90deg)}
.group-count{font-size:12px;color:var(--muted);font-weight:600}
.group-prog{display:flex;align-items:center;gap:10px;margin-top:10px}
.group-prog .pct{font-size:13px}
.group.collapsed .plist{display:none}
.group-tools{display:flex;gap:2px}

/* ---------- project cards ---------- */
.plist{display:flex;flex-direction:column;gap:10px;padding:0 12px 12px}
.plist.flat{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));padding:0;gap:14px;align-items:start}
.pcard{--g:#64748b;--s:#64748b;position:relative;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--g);border-radius:12px;padding:12px 14px;transition:box-shadow .2s,transform .2s}
.group .pcard{background:color-mix(in srgb,var(--surface-2) 45%,var(--surface))}
.pcard.lift-wait{transition:transform .35s ease-out;transform:scale(.985)}
.pcard.lift-ph,.group .pcard.lift-ph{background:transparent!important;border:2px dashed var(--line-2)!important;box-shadow:none!important;animation:none!important}
.pcard.lift-ph>*{visibility:hidden}
.lift-ghost{position:fixed!important;z-index:85;margin:0!important;pointer-events:none;transition:transform .16s ease-out,box-shadow .16s ease-out;will-change:left,top,transform;animation:none!important}
.lift-ghost.up{transform:scale(1.045) rotate(-.6deg);box-shadow:0 26px 60px rgba(0,0,0,.38),0 0 0 2px var(--accent)}
.plist .pcard{-webkit-touch-callout:none}
.plist .pcard .pc-head,.plist .pcard .pc-progress,.plist .pcard .tags{-webkit-user-select:none;user-select:none}
.pcard.dragging{box-shadow:0 18px 40px rgba(0,0,0,.25);transform:scale(1.015);z-index:5;opacity:.97}
.pcard.is-done .pc-name{color:var(--muted)}
.pc-head{display:flex;gap:6px;align-items:flex-start}
.grip{touch-action:none;cursor:grab;border:0;background:none;color:var(--muted);padding:2px;margin:1px 0 0 -6px;border-radius:6px;display:grid;place-items:center}
.grip:active{cursor:grabbing}
.grip svg{fill:currentColor;width:18px;height:18px}
.pc-title{flex:1;min-width:0;text-align:left;background:none;border:0;padding:0}
.pc-name{display:flex;align-items:center;gap:6px;font-weight:680;font-size:15px;line-height:1.3;letter-spacing:-.005em}
.pc-name .star{width:15px;height:15px;fill:#f59e0b;color:#f59e0b}
.pc-meta{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.late{color:#dc2626;font-weight:600}
.pc-progress{display:flex;align-items:center;gap:10px;margin-top:10px}
.pct{font-weight:750;font-size:13px;font-variant-numeric:tabular-nums;min-width:38px;text-align:right}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.pc-body{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line-2)}
.pc-desc{margin:0 0 8px;color:var(--muted);font-size:13.5px}
.pc-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}

/* ---------- tasks ---------- */
.tasks{list-style:none;margin:0;padding:0;display:grid;gap:1px}
.task{display:flex;align-items:center;gap:4px}
.task label{display:flex;align-items:center;gap:10px;flex:1;padding:7px 8px;border-radius:8px;cursor:pointer;min-width:0}
.task label:hover{background:var(--surface-2)}
.task.ro label{cursor:default}
.task.ro label:hover{background:none}
.task span{min-width:0;overflow-wrap:anywhere}
.task.done span{text-decoration:line-through;color:var(--muted)}
input[type=checkbox]{-webkit-appearance:none;appearance:none;width:20px;height:20px;border:2px solid var(--line-2);border-radius:6px;display:grid;place-content:center;flex:none;margin:0;background:var(--surface);cursor:pointer;transition:background .15s,border-color .15s}
input[type=checkbox]:checked{background:var(--g,var(--accent));border-color:var(--g,var(--accent))}
input[type=checkbox]:checked::after{content:"";width:10px;height:5px;border-left:2.5px solid #fff;border-bottom:2.5px solid #fff;transform:translateY(-1px) rotate(-45deg)}
input[type=checkbox]:disabled{cursor:default}
.tgrip{touch-action:none;cursor:grab;border:0;background:none;color:var(--muted);padding:4px 1px;display:grid;place-items:center;border-radius:6px;opacity:.5;flex:none}
.tgrip:hover,.task:hover .tgrip{opacity:1}
.tgrip svg{fill:currentColor;width:16px;height:16px}
.task.dragging,.trow.dragging{background:var(--surface);box-shadow:0 10px 28px rgba(0,0,0,.28);border-radius:8px;position:relative;z-index:3}
body.is-dragging{user-select:none;-webkit-user-select:none;cursor:grabbing}
.classify{display:grid;gap:10px;margin:0 0 12px;padding:10px 12px;border-radius:10px;background:var(--surface-2)}
.classify-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.classify-l{font-size:12px;font-weight:700;color:var(--muted);min-width:96px}
.catsel{height:34px;border:1px solid var(--line);border-radius:8px;padding:0 8px;background:var(--surface);max-width:100%;font-weight:600}
.kwadd{display:inline-flex;gap:4px}
.kwadd input{height:28px;width:130px;border:1px dashed var(--line-2);border-radius:7px;padding:0 8px;background:transparent;outline:none;font-size:12.5px}
.kwadd input:focus{border-style:solid;border-color:var(--accent)}
.addtask{display:flex;gap:6px;margin-top:8px}
.addtask input{flex:1;min-width:0;height:36px;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:var(--bg);outline:none}
.addtask input:focus{border-color:var(--accent)}
.empty{padding:40px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line-2);border-radius:var(--r)}
.foot{color:var(--muted);font-size:12px;text-align:center;padding:28px 0 calc(28px + env(safe-area-inset-bottom))}

/* ---------- modal ---------- */
.modal-back{position:fixed;inset:0;background:rgba(5,10,20,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50;animation:fade .15s}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:16px;width:min(680px,100%);max-height:calc(100dvh - 32px);display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 14px 14px 20px;border-bottom:1px solid var(--line)}
.modal-head h2{margin:0;font-size:17px;letter-spacing:-.01em}
.modal-body{padding:18px 20px;overflow:auto}
.modal-foot{display:flex;gap:8px;justify-content:flex-end;align-items:center;padding:12px 20px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.modal-foot .spacer{flex:1}
@media(max-width:600px){.modal-back{align-items:flex-end;padding:0}.modal{border-radius:18px 18px 0 0;max-height:92dvh;width:100%}}
.field{display:grid;gap:6px;margin-bottom:14px}
.field>label,.field-l{font-size:13px;font-weight:650;color:var(--muted)}
.field input:not([type=checkbox]):not([type=color]),.field select,.field textarea,.inp{height:42px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:var(--bg);outline:none;width:100%;min-width:0}
.field textarea{height:auto;padding:10px 12px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus,.inp:focus{border-color:var(--accent)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.row2{grid-template-columns:1fr}}
.trow{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.trow .inp{height:38px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:-4px -20px 16px;padding:0 16px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 12px;font-weight:650;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.list-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.list-row:last-child{border-bottom:0}
.list-row input[type=color]{width:38px;height:38px;border:1px solid var(--line);border-radius:8px;padding:2px;background:var(--bg)}
.ubox{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.ubox-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ubox-h b{flex:1}
.note{font-size:13px;color:var(--muted);background:var(--surface-2);border-radius:10px;padding:10px 12px;margin:0 0 14px}
.data-actions{display:grid;gap:10px}
.data-actions .btn{justify-content:flex-start;height:auto;padding:12px 14px;text-align:left;white-space:normal}
.data-actions .btn small{display:block;font-weight:500;color:var(--muted);font-size:12.5px}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#0f1729;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:90;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- login ---------- */
.login-wrap{min-height:100dvh;display:grid;place-items:center;padding:20px;background:radial-gradient(900px 500px at 15% -10%,color-mix(in srgb,var(--accent) 22%,transparent),transparent 60%),var(--bg)}
.login-card{width:min(400px,100%);background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:28px 24px;box-shadow:0 20px 60px rgba(0,0,0,.12)}
.login-card .logo{width:48px;height:48px;font-size:22px;border-radius:14px;margin-bottom:16px}
.login-card h1{margin:0 0 4px;font-size:22px;letter-spacing:-.02em}
.login-card p{margin:0 0 20px}
.check{display:flex;align-items:center;gap:10px;font-size:14px;margin:4px 0 18px;cursor:pointer}
.err{color:#dc2626;font-size:13.5px;min-height:20px;margin:10px 0 0!important}
.hint{font-size:12.5px;color:var(--muted);background:var(--surface-2);padding:10px 12px;border-radius:10px;margin:8px 0 0!important}

/* ---------- TV ---------- */
.tv{--surface:#0f1626;--surface-2:#1a2438;--text:#eef2fa;--muted:#93a0b8;--line:#1f2a40;
  position:fixed;inset:0;color:var(--text);background:radial-gradient(1400px 700px at 0% -10%,#122347 0%,transparent 60%),radial-gradient(900px 600px at 110% 110%,#0d2a33 0%,transparent 60%),#070b14;
  display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:clamp(10px,1.8vmin,28px);padding:clamp(12px,2.4vmin,44px);overflow:hidden;font-size:clamp(11px,1.55vmin,48px);color-scheme:dark}
.tv .pill{font-size:.8em;padding:.2em .8em;color:color-mix(in srgb,var(--s) 65%,#fff)}
.tv .pill::before{width:.6em;height:.6em}
.tv-top{display:flex;justify-content:space-between;align-items:center;gap:1em}
.tv-brand{display:flex;align-items:center;gap:.9em;min-width:0}
.tv .logo{width:2.6em;height:2.6em;font-size:1.1em;border-radius:.7em}
.tv-title{font-size:1.6em;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.tv-sub{color:var(--muted);font-size:.95em}
.tv-clock{text-align:right}
.tv-time{font-size:2.3em;font-weight:750;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.tv-date{color:var(--muted);font-size:.9em;text-transform:capitalize}
.tv-body{display:grid;gap:clamp(10px,1.8vmin,28px);grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);min-height:0}
@media (min-aspect-ratio:5/4){.tv-body{grid-template-columns:minmax(0,.95fr) minmax(0,2fr);grid-template-rows:minmax(0,1fr)}}
.tv-hero{--g:#1d5fd6;--s:#64748b;border-radius:1.2em;padding:clamp(14px,3vmin,52px);background:linear-gradient(165deg,color-mix(in srgb,var(--g) 32%,#0f1626) 0%,#0f1626 75%);border:1px solid color-mix(in srgb,var(--g) 45%,transparent);display:flex;flex-direction:column;gap:.8em;min-height:0;overflow:hidden}
.tv-hero.swap{animation:rise .7s ease}
.tv-hero-k{font-size:.8em;font-weight:750;letter-spacing:.14em;text-transform:uppercase;color:color-mix(in srgb,var(--g) 60%,#fff)}
.tv-hero-name{font-size:2.7em;font-weight:820;line-height:1.04;letter-spacing:-.03em}
.tv-hero-row{display:flex;flex-wrap:wrap;gap:.6em 1em;align-items:center;color:var(--muted)}
.tv-hero .pill{font-size:1em}
.tv-hero-pct{font-size:4.6em;font-weight:820;line-height:.95;letter-spacing:-.04em;font-variant-numeric:tabular-nums;margin-top:auto}
.tv-hero .bar{height:.75em;flex:none;background:rgba(255,255,255,.08)}
.tv-next{list-style:none;margin:.2em 0 0;padding:0;display:grid;gap:.45em;color:#cdd5e4}
.tv-next li{display:flex;gap:.6em;align-items:baseline}
.tv-next li::before{content:"";width:.5em;height:.5em;border-radius:50%;border:2px solid var(--g);flex:none;transform:translateY(-.05em)}
.tv-next-k{font-size:.78em;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-weight:700;margin-top:.4em}
.tv-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,15em),1fr));gap:clamp(8px,1.4vmin,22px);align-content:start;align-items:start;overflow-y:auto;scrollbar-width:none;min-height:0}
.tv-grid::-webkit-scrollbar{display:none}
.tv-col{--g:#64748b;background:rgba(255,255,255,.035);border:1px solid var(--line);border-top:3px solid var(--g);border-radius:.9em;padding:.8em .9em .5em}
.tv-col-h{display:flex;justify-content:space-between;align-items:baseline;gap:.6em;font-weight:780;font-size:1.05em;letter-spacing:-.01em}
.tv-col-h span:last-child{color:color-mix(in srgb,var(--g) 60%,#fff);font-variant-numeric:tabular-nums}
.tv-col>.bar{height:.3em;margin:.5em 0 .3em;background:rgba(255,255,255,.07)}
.tv-item{padding:.55em .45em;margin:0 -.45em;border-top:1px solid var(--line);border-radius:.5em}
.tv-item:first-of-type{border-top-color:transparent}
.tv-item.spot{background:color-mix(in srgb,var(--g) 20%,transparent);border-top-color:transparent}
.tv-item-r{display:flex;justify-content:space-between;align-items:center;gap:.6em}
.tv-item-n{font-weight:650;font-size:1em;line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tv-item-p{display:flex;align-items:center;gap:.6em;margin-top:.35em}
.tv-item-p .bar{height:.32em;background:rgba(255,255,255,.07)}
.tv-item-p b{font-size:.85em;font-variant-numeric:tabular-nums;min-width:2.8em;text-align:right;color:#cdd5e4}
.tv-legend{display:flex;flex-wrap:wrap;gap:.5em 1.4em;align-items:center;color:var(--muted);font-size:.9em}
.tv-legend .pill{font-size:.95em}
.tv-legend .upd{margin-left:auto}
.tv-controls{position:fixed;top:12px;left:50%;transform:translateX(-50%);display:flex;gap:8px;opacity:0;transition:opacity .3s;z-index:5}
.tv.show-controls .tv-controls{opacity:1}
.tv-controls .btn{background:rgba(15,22,38,.92);border-color:#2a3650;color:#eef2fa}
.tv:not(.show-controls){cursor:none}

/* TV resumido */
.tvc-wrap{min-height:0;overflow:hidden;position:relative;scrollbar-width:none}
.tvc-wrap::-webkit-scrollbar{display:none}
.tvc-cols{column-gap:.9em;font-size:16px}
.tvc-g{--g:#64748b;display:inline-block;width:100%;break-inside:avoid;-webkit-column-break-inside:avoid;background:rgba(255,255,255,.035);border:1px solid var(--line);border-top:3px solid var(--g);border-radius:.6em;padding:.45em .6em .35em;margin:0 0 .8em}
.tvc-gh{display:flex;align-items:baseline;gap:.5em;font-weight:780;font-size:1.08em;letter-spacing:-.01em}
.tvc-gh .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tvc-gh .c{color:var(--muted);font-weight:600;font-size:.75em;white-space:nowrap}
.tvc-gh .p{color:color-mix(in srgb,var(--g) 60%,#fff);font-variant-numeric:tabular-nums}
.tvc-g>.bar{height:.22em;margin:.35em 0 .25em;background:rgba(255,255,255,.07)}
.tvc-r{display:grid;grid-template-columns:minmax(0,1fr) auto auto 2.6em 2.6em;align-items:center;gap:.55em;padding:.3em .35em;margin:0 -.35em;border-top:1px solid var(--line);border-radius:.35em}
.tvc-g>.tvc-r:nth-of-type(1){border-top-color:transparent}
.tvc-r .nm{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.2;font-weight:600;overflow-wrap:anywhere}
.tvc-r .nm .star{width:.85em;height:.85em;fill:#f59e0b;vertical-align:-.05em;margin-right:.25em}
.tvc-r .pill{font-size:.66em;padding:.1em .55em}
.tvc-r .pill::before{width:.55em;height:.55em}
.tvc-r .bar{height:.3em;background:rgba(255,255,255,.08);min-width:0}
.tvc-r b{font-size:.85em;text-align:right;font-variant-numeric:tabular-nums;color:#cdd5e4}
.tvc-r.feat{background:color-mix(in srgb,var(--g) 24%,transparent);border-top-color:transparent}
.tvc-r.done .nm{color:var(--muted)}
.task.editing{display:block;padding:8px;margin:4px 0;border:1px solid var(--accent);border-radius:10px;background:var(--surface)}
.tedit{display:grid;gap:8px}
.tedit .te-text{height:38px}
.te-dates{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:12.5px;color:var(--muted)}
.te-dates label{display:flex;align-items:center;gap:6px}
.te-foot{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.te-foot .muted{flex:1;font-size:11.5px;min-width:140px}
@media(max-width:600px){
  .task{flex-wrap:wrap}
  .task label{flex:1 1 0}
  .task .tdate{order:5;flex-basis:100%;padding:0 0 4px 58px;margin-top:-6px}
  .task.ro .tdate{padding-left:38px}
  .te-dates{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .te-dates label{flex-direction:column;align-items:stretch;gap:4px}
  .te-dates .date-inp{width:100%;min-width:0}
}
.tdate{font-size:11.5px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums;flex:none}
.task.done .tdate{color:#16a34a;text-decoration:none}
:root[data-theme="dark"] .task.done .tdate{color:#4ade80}
.dt-late{color:#dc2626;font-weight:650}
.dt-soon{color:#d97706;font-weight:650}
.pc-dates{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted);margin:0 0 12px}
.pc-dates b{color:var(--text);font-weight:600}
.notes{margin:12px 0 0;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.notes-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.notes-h b{font-size:13px}
.notes-at{font-size:11.5px;color:var(--muted)}
.notes-ta{width:100%;min-height:72px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg);outline:none;resize:vertical;font-size:14px;line-height:1.45}
.notes-ta:focus{border-color:var(--accent)}
.notes-ro{white-space:pre-wrap;font-size:14px;line-height:1.5;overflow-wrap:anywhere}
.date-inp{height:34px;border:1px solid var(--line);border-radius:8px;padding:0 8px;background:var(--surface);font-size:13px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
@media(max-width:600px){.row3{grid-template-columns:1fr 1fr}.row3>:first-child{grid-column:1/-1}}
.lg-filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.lg-filters .inp{height:38px}
.lg-filters .inp[type=search]{grid-column:1/-1}
.lg-day{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:16px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.lg-day:first-child{margin-top:0}
.lg-row{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.lg-row:last-child{border-bottom:0}
.lg-time{color:var(--muted);font-variant-numeric:tabular-nums;padding-top:1px}
.lg-k{--s:#64748b;display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:5px;margin-right:6px;color:var(--s);background:color-mix(in srgb,var(--s) 14%,transparent);vertical-align:1px}
:root[data-theme="dark"] .lg-k{color:color-mix(in srgb,var(--s) 70%,#fff)}
.lg-u{color:var(--muted);font-size:12px}
.lg-sum{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px;background:var(--surface-2)}
.lg-sum h3{margin:0 0 6px;font-size:15px}
.tvc-r .dt{font-size:.74em;color:#aab4c8;white-space:nowrap;font-variant-numeric:tabular-nums;text-align:right}
.tvc-r .dt.dt-late{color:#f87171}
.tvc-r .dt.dt-soon{color:#fbbf24}
.tvc-r .dt.dt-ok{color:#4ade80}
.tv-item-d{font-size:.78em;color:#aab4c8;margin-top:.15em;font-variant-numeric:tabular-nums}
.tv-item-d.dt-late{color:#f87171}.tv-item-d.dt-soon{color:#fbbf24}.tv-item-d.dt-ok{color:#4ade80}
.tv-hero-dates{display:flex;flex-wrap:wrap;gap:.3em 1.2em;color:#cdd5e4;font-size:.95em;font-variant-numeric:tabular-nums}
.tv-hero-dates span b{color:var(--muted);font-weight:600;margin-right:.35em}
.tv-hero-dates .dt-late{color:#f87171}.tv-hero-dates .dt-soon{color:#fbbf24}
.hidden-cats{margin:14px 0 0;font-size:12.5px;color:var(--muted);text-align:center}
/* ---------- prioridade ---------- */
.prio-b{display:inline-block;margin-left:.5em;padding:.12em .5em;border-radius:.35em;background:#dc2626;color:#fff;font-size:.62em;font-weight:800;letter-spacing:.06em;text-transform:uppercase;vertical-align:.18em;line-height:1.3;white-space:nowrap}
.pcard.prio,.group .pcard.prio{border-color:#dc2626;border-left-color:#dc2626;background:color-mix(in srgb,#dc2626 9%,var(--surface));box-shadow:0 0 0 1px color-mix(in srgb,#dc2626 45%,transparent)}
.pcard.prio.recent{box-shadow:0 0 0 1px color-mix(in srgb,#dc2626 45%,transparent)}
.hero.prio{border-color:#dc2626}
.prio-tg{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px 0 8px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);font-size:13px;font-weight:650;color:var(--muted)}
.prio-tg i{width:30px;height:18px;border-radius:99px;background:var(--line-2);position:relative;transition:background .15s}
.prio-tg i::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .15s}
.prio-tg.on{border-color:#dc2626;color:#dc2626}
.prio-tg.on i{background:#dc2626}
.prio-tg.on i::after{transform:translateX(12px)}
.pill.prio-chip{font-weight:800}
.tvc-r.prio{background:rgba(220,38,38,.2);box-shadow:inset .22em 0 0 #ef4444;border-top-color:transparent}
.tvc-r.prio .bar i{background:#ef4444}
.tv-item.prio{background:rgba(220,38,38,.2);box-shadow:inset .2em 0 0 #ef4444;border-top-color:transparent}
.tv-item.prio .bar i{background:#ef4444}
.tv-hero.prio{border-color:#ef4444}
.tl-it.prio .tl-arrow{background:#fca5a5}
.tl-it.prio .tl-arrow i{background:#dc2626}
.tl-it.prio .tl-lbl{color:#450a0a}
.tl-it.prio .tl-lbl.out{color:#fecaca}
.tl-row.prio{background:rgba(220,38,38,.18);box-shadow:inset .22em 0 0 #ef4444}
.tl-row.prio .tl-n .nm{color:#fecaca}
.tl-card.prio{background:rgba(220,38,38,.2);box-shadow:0 0 0 1px rgba(239,68,68,.6)}
.tv .prio-b{background:#ef4444}
[data-design="suave"] .tl-card.prio{box-shadow:inset .25em 0 0 #dc2626,0 0 0 1px rgba(239,68,68,.6)}
/* ---------- janela flutuante do projeto ---------- */
.pv-pop{position:fixed;z-index:90;width:min(380px,calc(100vw - 20px));max-height:min(70vh,560px);overflow:auto;padding:14px 16px 12px;border-radius:14px;background:var(--surface);color:var(--text);border:1px solid var(--line-2);box-shadow:0 24px 60px rgba(0,0,0,.28);font-size:14px;line-height:1.45;animation:fade .14s}
.pv-pop.in-tv{--surface:#121a2b;--surface-2:#1a2438;--text:#eef2fa;--muted:#93a0b8;--line:#22304a;--line-2:#2a3650;width:min(30em,calc(100vw - 20px));font-size:clamp(14px,1.45vmin,24px);color-scheme:dark;box-shadow:0 24px 60px rgba(0,0,0,.6)}
.pv-h{display:flex;align-items:center;gap:8px;font-size:.8em;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.pv-h .dot{width:.75em;height:.75em;border-radius:.2em;background:var(--g);flex:none}
.pv-cat{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv-x{border:0;background:none;color:var(--muted);padding:2px;border-radius:6px;display:grid;place-items:center;cursor:pointer}
.pv-x svg{width:1.15em;height:1.15em}
.pv-name{font-size:1.25em;font-weight:780;letter-spacing:-.01em;line-height:1.2;margin:4px 0 8px}
.pv-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:.88em;color:var(--muted)}
.pv-meta .pill{font-size:.9em}
.pv-prog{display:flex;align-items:center;gap:10px;margin:10px 0 6px}
.pv-prog b{font-size:.9em;font-variant-numeric:tabular-nums}
.pv-dates{display:flex;flex-wrap:wrap;gap:2px 14px;font-size:.84em;color:var(--muted);margin:2px 0 4px}
.pv-dates b{color:var(--text);font-weight:650}
.pv-dates b.dt-late{color:#ef4444}.pv-dates b.dt-soon{color:#d97706}.pv-dates b.dt-ok{color:#16a34a}
.pv-desc{margin:8px 0 0;font-size:.9em;color:var(--muted)}
.pv-sec{margin:12px 0 5px;font-size:.74em;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.pv-sec span{text-transform:none;letter-spacing:0;font-weight:500}
.pv-notes{white-space:pre-wrap;overflow-wrap:anywhere;padding:10px 12px;border-radius:10px;background:var(--surface-2);border-left:3px solid var(--accent,#5b93ff);font-size:.95em}
.pv-notes.empty{color:var(--muted);font-style:italic;border-left-color:var(--line-2)}
.pv-next{margin:0;padding:0 0 0 1.1em;font-size:.9em}
.pv-next li{margin:2px 0}
.pv-act{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.pv-pop.in-tv .btn{background:#1a2438;border-color:#2a3650;color:#eef2fa;font-size:.8em;height:auto;padding:.45em .8em}
@media(max-width:600px){.pv-pop{width:calc(100vw - 20px);max-height:75vh}}
/* ---------- trocar status no modo TV ---------- */
.tv [data-sp]{cursor:pointer;transition:box-shadow .15s,filter .15s}
.tv [data-sp]:hover{box-shadow:0 0 0 2px color-mix(in srgb,var(--s,#5b93ff) 70%,#fff);filter:brightness(1.15)}
.tl-st[data-sp]{border-radius:.3em;padding:0 .2em;margin:0 -.2em;text-decoration:underline dotted;text-underline-offset:.2em}
.st-pop{position:fixed;z-index:95;min-width:min(240px,90vw);max-height:80vh;overflow:auto;padding:6px;border-radius:12px;background:#121a2b;border:1px solid #2a3650;box-shadow:0 20px 50px rgba(0,0,0,.55);color:#eef2fa;font:clamp(14px,1.5vmin,24px)/1.3 var(--font);animation:fade .12s}
.st-pop-h{font-size:.78em;font-weight:700;color:#93a0b8;padding:.45em .7em .4em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:22em}
.st-opt{display:flex;align-items:center;gap:.6em;width:100%;padding:.55em .7em;border:0;border-radius:8px;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.st-opt:hover,.st-opt:focus-visible{background:rgba(255,255,255,.08);outline:none}
.st-opt i{width:.7em;height:.7em;border-radius:50%;background:var(--s);flex:none}
.st-opt.on{background:color-mix(in srgb,var(--s) 22%,transparent);font-weight:700}
.st-opt.new{color:#93a0b8;border-top:1px solid #2a3650;border-radius:0 0 8px 8px;margin-top:4px}
.st-opt.new svg{width:1em;height:1em}

/* ---------- linha do tempo (modo TV) ---------- */
.tl-wrap{min-height:0;position:relative;overflow:hidden}
.tl{position:absolute;inset:0;display:flex;flex-direction:column;font-size:16px}
.tl-head{display:grid;grid-template-columns:var(--lw) minmax(0,1fr);flex:none}
.tl-axis{position:relative;height:3.1em}
.tl-mon{position:absolute;top:0;height:1.65em;display:flex;align-items:center;padding-left:.7em;overflow:hidden;white-space:nowrap;font-weight:800;font-size:.86em;letter-spacing:.09em;text-transform:uppercase;color:#e4ebf7;background:rgba(255,255,255,.07);border-left:2px solid rgba(255,255,255,.3);clip-path:polygon(0 0,calc(100% - .7em) 0,100% 50%,calc(100% - .7em) 100%,0 100%)}
.tl-mon.alt{background:rgba(255,255,255,.12)}
.tl-wk{position:absolute;top:2.05em;transform:translateX(-50%);font-size:.68em;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.tl-body{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.tl-grid{position:absolute;top:0;bottom:0;right:0;left:var(--lw);pointer-events:none;z-index:2}
.tl-gl{position:absolute;top:0;bottom:0;border-left:1px dashed rgba(255,255,255,.08)}
.tl-gl.m{border-left:1.5px dashed rgba(255,255,255,.26)}
.tl-today{position:absolute;top:0;bottom:0;border-left:2px solid #f43f5e}
.tl-tlab{position:absolute;top:1.85em;transform:translateX(-50%);font-size:.68em;font-weight:800;color:#fff;background:#f43f5e;border-radius:.35em;padding:.12em .5em;white-space:nowrap;z-index:3}
.tl-today b{position:absolute;top:-.1em;left:.35em;font-size:.66em;font-weight:750;color:#fff;background:#f43f5e;border-radius:.35em;padding:.1em .45em;white-space:nowrap}
.tl-late{position:absolute;top:50%;height:0;border-top:2px dashed #f87171;z-index:1}
/* faixas */
.tl-lane{display:grid;grid-template-columns:var(--lw) minmax(0,1fr);border-top:1px solid rgba(255,255,255,.13);min-height:0}
.tl-lane:nth-child(odd){background:rgba(255,255,255,.018)}
.tl-lane-l{display:flex;flex-direction:column;justify-content:center;gap:.15em;padding:0 .9em 0 .5em;border-left:.25em solid var(--g);min-width:0}
.tl-lane-l b{font-size:1.02em;line-height:1.15;font-weight:780}
.tl-lane-l span{font-size:.72em;color:var(--muted)}
.tl-track{position:relative;min-width:0}
.tl-it{position:absolute;left:0;right:0;height:1.45em}
.tl-arrow{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--g) 42%,#fff);clip-path:polygon(0 0,calc(100% - .65em) 0,100% 50%,calc(100% - .65em) 100%,0 100%);overflow:hidden}
.tl-arrow i{position:absolute;left:0;top:0;bottom:0;background:var(--g)}
.tl-lbl{position:absolute;top:0;bottom:0;display:flex;align-items:center;gap:.45em;padding:0 .9em 0 .55em;white-space:nowrap;font-size:.8em;font-weight:700;color:#0a1322;z-index:3}
.tl-lbl.out{color:#e8eef8;padding-left:.9em}
.tl-lbl small{font-weight:600;opacity:.78;font-size:.88em}
.tl-lbl em{font-style:normal;color:#b91c1c;font-weight:800}
.tl-lbl.out em{color:#f87171}
.tl-lbl .sd{width:.6em;height:.6em;border-radius:50%;background:var(--s);box-shadow:0 0 0 .14em rgba(255,255,255,.85);flex:none}
/* gantt */
.tl-row{display:grid;grid-template-columns:var(--lw) minmax(0,1fr);align-items:stretch;min-height:0;border-top:1px solid rgba(255,255,255,.06)}
.tl-row.cat{border-top:1px solid rgba(255,255,255,.2);background:color-mix(in srgb,var(--g) 13%,transparent)}
.tl-n{display:flex;align-items:center;gap:.55em;min-width:0;padding:0 .8em 0 .4em}
.tl-row.cat .tl-n b{font-weight:800;font-size:.95em;letter-spacing:.04em;text-transform:uppercase;color:color-mix(in srgb,var(--g) 55%,#fff)}
.tl-row.cat .dot{width:.7em;height:.7em;border-radius:.2em;background:var(--g);flex:none}
.tl-row.cat .c{margin-left:auto;font-size:.8em;color:var(--muted);font-variant-numeric:tabular-nums}
.tl-n .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;font-size:.92em}
.tl-n .nm .star{width:.85em;height:.85em;fill:#f59e0b;vertical-align:-.05em;margin-right:.25em}
.tl-n .pill{font-size:.62em;padding:.08em .55em;flex:none}
.tl-row .tl-track{height:100%}
.tl-gbar{position:absolute;top:24%;bottom:24%;border-radius:.3em;background:color-mix(in srgb,var(--g) 28%,transparent);border:1px solid color-mix(in srgb,var(--g) 70%,transparent);overflow:hidden}
.tl-gbar i{position:absolute;left:0;top:0;bottom:0;background:var(--g)}
.tl-gbar.late{border-color:#f87171}
.tl-glbl{position:absolute;top:0;bottom:0;display:flex;align-items:center;padding-left:.55em;font-size:.72em;font-weight:650;color:#dbe3f0;white-space:nowrap;font-variant-numeric:tabular-nums;text-shadow:0 1px 2px rgba(0,0,0,.6);z-index:3}
.tl-glbl.dt-late{color:#fca5a5}.tl-glbl.dt-soon{color:#fcd34d}.tl-glbl.dt-ok{color:#86efac}
/* por mês */
.tl-cols{display:flex;gap:.8em;height:100%}
.tl-col{display:flex;flex-direction:column;min-width:13em;background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:.8em;overflow:hidden}
.tl-col.cur{border-color:color-mix(in srgb,var(--accent,#5b93ff) 60%,transparent)}
.tl-col.late{border-color:rgba(248,113,113,.55);background:rgba(248,113,113,.06)}
.tl-col-h{display:flex;justify-content:space-between;align-items:baseline;gap:.6em;padding:.6em .8em;border-bottom:1px solid var(--line);flex:none}
.tl-col-h b{font-size:1.05em;font-weight:800;letter-spacing:.02em}
.tl-col.late .tl-col-h b{color:#f87171}
.tl-col-h span{font-size:.72em;color:var(--muted);white-space:nowrap}
.tl-col-b{flex:1;min-height:0;padding:.55em;column-width:14em;column-gap:.55em;column-fill:auto;overflow:hidden}
.tl-card{display:inline-block;width:100%;break-inside:avoid;margin:0 0 .5em;padding:.5em .6em .55em;border-radius:.55em;background:rgba(255,255,255,.055);border-left:.22em solid var(--g)}
.tl-card .n{font-weight:700;line-height:1.2;font-size:.95em}
.tl-card .n .star{width:.85em;height:.85em;fill:#f59e0b;vertical-align:-.05em;margin-right:.25em}
.tl-card .g{font-size:.7em;color:var(--muted);margin-top:.15em}
.tl-card .m{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:.4em;margin-top:.4em;font-size:.75em;color:#cdd5e4;font-variant-numeric:tabular-nums}
.tl-card .m .pill{font-size:.85em;padding:.05em .5em}
.tl-card .m .dt-late{color:#f87171;font-weight:700}.tl-card .m .dt-soon{color:#fbbf24;font-weight:700}.tl-card .m .dt-ok{color:#4ade80}
.tl-card .p{display:flex;align-items:center;gap:.5em;margin-top:.35em}
.tl-card .p .bar{height:.28em;background:rgba(255,255,255,.08)}
.tl-card .p b{font-size:.72em;font-variant-numeric:tabular-nums;color:#cdd5e4}
.tl-empty{color:var(--muted);font-size:.8em;margin:.3em .2em}

/* ================= OPÇÕES DE DESIGN ================= */
.design-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.design-opt{border:2px solid var(--line);border-radius:12px;padding:8px;background:var(--surface);text-align:left;display:grid;gap:8px}

function valid(d) { return d && typeof d === 'object' && Array.isArray(d.projects) && Array.isArray(d.groups) && Array.isArray(d.users); }
function normalize(d) {

  if (!Array.isArray(d.statuses) || !d.statuses.length) d.statuses = DEFAULT_STATUSES.map(x => Object.assign({}, x));
  if (!d.statuses.some(x => x.id === 'concluido')) d.statuses.push({ id: 'concluido', label: 'Concluído', color: '#16a34a' });
  syncStatus(d.statuses);
  if (!Array.isArray(d.log)) d.log = [];
  d.projects.forEach(p => { p.tasks = p.tasks || []; p.tags = p.tags || []; p.notes = p.notes || ''; p.start = p.start || ''; if (!STATUS[p.status]) p.status = STATUS.planejado ? 'planejado' : openStatus(); });
  const gids = new Set(d.groups.map(g => g.id));
  if (!d.groups.length) d.groups.push({ id: 'g_' + uid(), name: 'Geral', color: '#64748b' });
  d.projects.forEach(p => { if (!gids.has(p.groupId)) p.groupId = d.groups[0].id; });
  if (!d.flags) d.flags = {};
  if (!d.flags.prioVermelha) { d.groups.forEach(g => { if (/prioridad/i.test(g.name || '')) g.color = '#dc2626'; }); d.flags.prioVermelha = Date.now(); }
  if (!d.flags.datasIniciais) { // preenchimento único: datas de partida do roadmap (só onde estava vazio)
    const T0 = new Date(2026, 9, 20, 9, 0).getTime();
    d.projects.forEach(p => {
      if (!p.start) p.start = '2026-10-20';
      if (!p.due) p.due = '2026-12-01';
      if (!p.createdAt) p.createdAt = T0;
      p.tasks.forEach(t => { if (!t.createdAt) t.createdAt = T0; if (t.done && !t.doneAt) t.doneAt = T0; });
      if (p.status === 'concluido' && !p.doneAt) p.doneAt = T0;
    });
    d.log.push({ ts: Date.now(), u: 'Sistema', pid: '', pn: 'Todos os projetos', k: 'datas', t: 'Datas iniciais preenchidas: etapas e início em 20/10/2026, prazos em 01/12/2026 (somente onde estava vazio)' });
    d.flags.datasIniciais = Date.now(); d._dirty = true;
  }
  return d;
}
function loadDB() {
  let seed = null, local = null;
  try { seed = JSON.parse(document.getElementById('seed').textContent); } catch (e) {}
  try { local = JSON.parse(LS.get(KEY)); } catch (e) {}
  let d = null;
  if (valid(seed) && valid(local)) d = (seed.updatedAt || 0) > (local.updatedAt || 0) ? seed : local;
  else d = valid(local) ? local : valid(seed) ? seed : buildDefault();
  normalize(d);
  if (d._dirty) { delete d._dirty; d.updatedAt = Date.now(); LS.set(KEY, JSON.stringify(d)); }
  return d;
}

const fmtDate = s => { if (!s) return ''; const [y, m, d] = s.split('-'); return `${d}/${m}/${y}`; };
const fmtStamp = ts => ts ? new Date(ts).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '—';
const pad2 = n => String(n).padStart(2, '0');
const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; };
const isLate = p => p.due && p.status !== 'concluido' && p.due < todayISO();
const daysTo = iso => Math.round((new Date(iso + 'T00:00:00') - new Date(todayISO() + 'T00:00:00')) / 86400000);
/* dd/mm (com ano quando não for o ano atual) a partir de 'AAAA-MM-DD' ou timestamp */
function fmtD(v) {
  if (!v) return '';
  const d = typeof v === 'number' ? new Date(v) : new Date(v + 'T00:00:00');
  const s = pad2(d.getDate()) + '/' + pad2(d.getMonth() + 1);
  return d.getFullYear() === new Date().getFullYear() ? s : s + '/' + String(d.getFullYear()).slice(2);
}
const fmtDT = ts => ts ? new Date(ts).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '—';
const fmtHM = ts => new Date(ts).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
/* texto curto das datas do projeto, usado nos cartões e no modo TV */
function dateInfo(p) {
  if (p.status === 'concluido') return { text: p.doneAt ? 'concluído ' + fmtD(p.doneAt) : 'concluído', cls: 'dt-ok' };
  let text = '';
  if (p.start && p.due) text = fmtD(p.start) + ' → ' + fmtD(p.due);
  else if (p.due) text = 'prazo ' + fmtD(p.due);
  else if (p.start) text = 'desde ' + fmtD(p.start);
  if (!p.due) return { text, cls: '' };
  const dd = daysTo(p.due);
  if (dd < 0) return { text: text + ' · atrasado', cls: 'dt-late' };
  if (dd === 0) return { text: text + ' · vence hoje', cls: 'dt-soon' };
  if (dd <= 3) return { text: text + ` · ${dd} ${dd === 1 ? 'dia' : 'dias'}`, cls: 'dt-soon' };
  return { text, cls: '' };
}

function setStatus(p, v, auto) {

/* salva a edição de uma etapa registrando o valor antigo e o novo no histórico */
function saveTaskEdit(f) {
  const p = byId(f.dataset.id), t = p && p.tasks.find(x => x.id === f.dataset.t); if (!t) return;
  const text = f.querySelector('.te-text').value.trim(); if (!text) { toast('O texto da etapa não pode ficar vazio'); return; }
  const cIso = f.querySelector('.te-c').value, dEl = f.querySelector('.te-d'), dIso = dEl ? dEl.value : null;
  const at = iso => new Date(iso + 'T12:00:00').getTime();
  const newC = cIso ? (cIso === isoOf(t.createdAt) ? t.createdAt : at(cIso)) : t.createdAt;
  const newD = dEl ? (dIso ? (dIso === isoOf(t.doneAt) ? t.doneAt : at(dIso)) : t.doneAt) : t.doneAt;
  if (t.done && newC && newD && isoOf(newD) < isoOf(newC)) { toast('A conclusão não pode ser antes da criação'); return; }
  const changes = [];
  if (text !== t.text) changes.push(['Texto', `"${t.text}" → "${text}"`]);
  if (isoOf(newC) !== isoOf(t.createdAt)) changes.push(['Criada em', `${fmtFull(t.createdAt)} → ${fmtFull(newC)}`]);
  if (t.done && isoOf(newD) !== isoOf(t.doneAt)) changes.push(['Concluída em', `${fmtFull(t.doneAt)} → ${fmtFull(newD)}`]);
  UI.editTask = null;
  if (!changes.length) { renderAll(); return; }
  t.text = text; t.createdAt = newC; if (t.done) t.doneAt = newD;
  changes.forEach(([k, v]) => logEv(p, 'etapa_editada', (k === 'Texto' ? '' : `"${text}" · `) + k + ': ' + v));
  t.editedAt = Date.now();
  save(); renderAll(); toast(changes.length === 1 ? 'Etapa editada' : `Etapa editada (${changes.length} alterações)`);
}
/* descobre qual etapa mudou de posição para registrar no histórico */
function logReorder(p, oldIds, newIds, texts) {
  if (oldIds.join() === newIds.join()) return;
  const moved = oldIds.find(id => { const a = oldIds.filter(x => x !== id), b = newIds.filter(x => x !== id); return a.join() === b.join(); });
  const t = (texts || p.tasks).find(x => x.id === moved) || {};
  logEv(p, 'etapa_ordem', moved ? `"${t.text}": posição ${oldIds.indexOf(moved) + 1} → ${newIds.indexOf(moved) + 1}` : 'Ordem das etapas alterada');
}

const rcDot = p => isRecent(p) ? `<span class="rc" title="${esc('Alterado ' + ago(p.updatedAt) + (lastChange(p) ? ' — ' + lastChange(p) : ''))}"><i></i></span>` : '';

let liftActive = false;
function liftSortable(list) {
  list.addEventListener('contextmenu', e => { if (liftActive || lastPT !== 'mouse') { if (e.target.closest('.pcard') && !e.target.closest('.pc-body')) e.preventDefault(); } });
  list.addEventListener('pointerdown', e => {
    const card = e.target.closest('.pcard');
    if (!card || card.parentElement !== list || (e.button && e.button !== 0) || liftActive) return;
    if (e.target.closest('.pc-body, input, textarea, select, a, .tag, [data-sp], .icon-btn')) return;
    const viaGrip = !!e.target.closest('.grip');
    const sx = e.clientX, sy = e.clientY, pid = e.pointerId;
    let timer = null;
    const stopWait = () => {
      clearTimeout(timer); card.classList.remove('lift-wait');
      window.removeEventListener('pointermove', pre); window.removeEventListener('pointerup', stopWait); window.removeEventListener('pointercancel', stopWait);
    };
    const pre = ev => { if (ev.pointerId === pid && Math.hypot(ev.clientX - sx, ev.clientY - sy) > 8) stopWait(); };
    const go = () => { stopWait(); startLift(list, card, sx, sy, pid); };
    if (viaGrip) { e.preventDefault(); go(); return; }
    card.classList.add('lift-wait');
    timer = setTimeout(go, e.pointerType === 'mouse' ? 350 : 430);
    window.addEventListener('pointermove', pre); window.addEventListener('pointerup', stopWait); window.addEventListener('pointercancel', stopWait);
  });
}
function liftLayoutRect(el) {
  const b = el.getBoundingClientRect(), t = getComputedStyle(el).transform;
  if (t && t !== 'none') { const m = new DOMMatrixReadOnly(t); return { left: b.left - m.m41, top: b.top - m.m42, width: b.width, height: b.height }; }
  return b;
}
function liftFlip(list, mutate) {
  const els = [...list.children].filter(el => el.classList.contains('pcard'));
  const first = new Map(els.map(el => [el, el.getBoundingClientRect()]));
  mutate();
  els.forEach(el => {
    if (el.classList.contains('lift-ph')) return;
    const a = first.get(el), b = el.getBoundingClientRect(), dx = a.left - b.left, dy = a.top - b.top;
    if (!dx && !dy) return;
    el.style.transition = 'none'; el.style.transform = `translate(${dx}px,${dy}px)`;
    void el.offsetWidth;
    el.style.transition = 'transform .24s cubic-bezier(.2,.75,.25,1)'; el.style.transform = '';
    clearTimeout(el._flipT); el._flipT = setTimeout(() => { el.style.transition = ''; }, 260);
  });
}
function startLift(list, card, x, y, pid) {
  liftActive = true; closePv(); clearTimeout(pvOpenT);
  try { window.getSelection().removeAllRanges(); } catch (_) {}
  const r = card.getBoundingClientRect(), offX = x - r.left, offY = y - r.top;
  const before = [...list.children].filter(el => el.classList.contains('pcard')).map(el => el.dataset.id).join();
  const ghost = card.cloneNode(true);
  ghost.querySelectorAll('[data-pv]').forEach(n => n.removeAttribute('data-pv'));
  ghost.classList.add('lift-ghost');
  Object.assign(ghost.style, { left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: r.height + 'px' });
  document.body.appendChild(ghost);
  requestAnimationFrame(() => ghost.classList.add('up'));
  card.classList.add('lift-ph');
  document.body.classList.add('is-dragging');
  if (navigator.vibrate) { try { navigator.vibrate(12); } catch (_) {} }
  const prio = isPrio(byId(card.dataset.id));
  const blockTouch = ev => ev.preventDefault();
  document.addEventListener('touchmove', blockTouch, { passive: false });
  let cx = x, cy = y, lastSwap = 0, moved = false;
  const reposition = () => {
    const now = performance.now(); if (now - lastSwap < 70) return;
    for (const sb of list.children) {
      if (sb === card || !sb.classList.contains('pcard')) continue;
      if (isPrio(byId(sb.dataset.id)) !== prio) continue; // prioridades ficam no topo
      const lr = liftLayoutRect(sb);
      if (cx < lr.left || cx > lr.left + lr.width || cy < lr.top || cy > lr.top + lr.height) continue;
      const wide = lr.width > list.clientWidth * 0.7;
      const after = wide ? cy > lr.top + lr.height / 2 : cx > lr.left + lr.width / 2;
      if (after ? sb.nextElementSibling === card : card.nextElementSibling === sb) return;
      liftFlip(list, () => list.insertBefore(card, after ? sb.nextElementSibling : sb));
      lastSwap = now; return;
    }
  };
  const move = ev => {
    if (ev.pointerId !== pid) return;
    ev.preventDefault();
    cx = ev.clientX; cy = ev.clientY;
    if (!moved && Math.hypot(cx - x, cy - y) > 24) moved = true;
    ghost.style.left = (cx - offX) + 'px'; ghost.style.top = (cy - offY) + 'px';
    reposition();
  };
  const scroller = setInterval(() => {
    const edge = 64; if (!moved) return;
    if (cy < edge) window.scrollBy(0, -Math.ceil((edge - cy) / 4));
    else if (cy > innerHeight - edge) window.scrollBy(0, Math.ceil((cy - innerHeight + edge) / 4));
    else return;
    reposition();
  }, 16);
  const end = ev => {
    if (ev && ev.pointerId !== undefined && ev.pointerId !== pid) return;
    window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', end); window.removeEventListener('pointercancel', end);
    document.removeEventListener('touchmove', blockTouch, { passive: false });
    clearInterval(scroller);
    // evita que soltar o cartão conte como clique (abrir/fechar ou janela flutuante)
    const eat = e2 => { e2.stopPropagation(); e2.preventDefault(); };
    window.addEventListener('click', eat, true); setTimeout(() => window.removeEventListener('click', eat, true), 350);
    const fr = card.getBoundingClientRect();
    ghost.style.transition = 'left .2s cubic-bezier(.2,.75,.25,1), top .2s cubic-bezier(.2,.75,.25,1), transform .2s, box-shadow .2s';
    ghost.style.left = fr.left + 'px'; ghost.style.top = fr.top + 'px'; ghost.classList.remove('up');
    setTimeout(() => {
      ghost.remove(); card.classList.remove('lift-ph'); document.body.classList.remove('is-dragging'); liftActive = false;
      const ids = [...list.children].filter(el => el.classList.contains('pcard')).map(el => el.dataset.id);
      if (ids.join() !== before) { reorderSubset(ids); save(); renderMain(); renderFoot(); }
    }, 210);
  };
  window.addEventListener('pointermove', move, { passive: false }); window.addEventListener('pointerup', end); window.addEventListener('pointercancel', end);
}

function reorderSubset(ids) {
  const set = new Set(ids), slots = [];
  DB.projects.forEach((p, i) => { if (set.has(p.id)) slots.push(i); });
  const map = Object.fromEntries(DB.projects.map(p => [p.id, p])), copy = DB.projects.slice();
  slots.forEach((slot, k) => { copy[slot] = map[ids[k]]; });
  DB.projects = copy;
}
function makeSortable(container, itemSel, handleSel, onDrop) {
  container.addEventListener('pointerdown', e => {
    const handle = e.target.closest(handleSel); if (!handle || e.button !== 0) return;
    const item = handle.closest(itemSel); if (!item || item.parentElement !== container) return;
    e.preventDefault(); e.stopPropagation();
    const items = () => [...container.querySelectorAll(':scope > ' + itemSel)];
    const before = items();
    item.classList.add('dragging'); document.body.classList.add('is-dragging');
    let raf = null;
    const move = ev => {
      ev.preventDefault();
      const x = ev.clientX, y = ev.clientY;
      let target = null;
      for (const sb of items()) {
        if (sb === item) continue;
        const r = sb.getBoundingClientRect(), wide = r.width > container.clientWidth * 0.7;
        if (wide ? y < r.top + r.height / 2 : (y < r.top || (y < r.bottom && x < r.left + r.width / 2))) { target = sb; break; }
      }
      if (target) { if (item.nextElementSibling !== target) container.insertBefore(item, target); }
      else { const last = items().pop(); if (last !== item) last.after(item); }
      cancelAnimationFrame(raf);
      if (y < 80) raf = requestAnimationFrame(() => window.scrollBy(0, -14));
      else if (y > innerHeight - 80) raf = requestAnimationFrame(() => window.scrollBy(0, 14));
    };
    const up = () => {
      window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); window.removeEventListener('pointercancel', up);
      item.classList.remove('dragging'); document.body.classList.remove('is-dragging');
      const after = items();
      if (after.some((el, i) => el !== before[i])) onDrop(after);
    };
    window.addEventListener('pointermove', move, { passive: false }); window.addEventListener('pointerup', up); window.addEventListener('pointercancel', up);
  });
}
function moveCard(id, dir) {
  const card = document.querySelector(`#main .plist .pcard[data-id="${id}"]`); if (!card) return;
  const ids = [...card.parentElement.querySelectorAll(':scope > .pcard')].map(x => x.dataset.id);
  const i = ids.indexOf(id), j = i + dir;
  if (j < 0 || j >= ids.length) return toast(dir < 0 ? 'Já está no topo' : 'Já está no fim');
  [ids[i], ids[j]] = [ids[j], ids[i]];
  reorderSubset(ids); save(); renderMain(); renderFoot();
  const el = document.querySelector(`#main .plist .pcard[data-id="${id}"]`); if (el) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

/* ---------- etapas ---------- */
function autoStatus(p) {
  const pr = progress(p);
  if (p.tasks.length && pr === 100 && p.status !== 'concluido') { setStatus(p, 'concluido', true); toast('Projeto concluído: ' + p.name); }
  else if (pr < 100 && p.status === 'concluido') setStatus(p, p.prevStatus && p.prevStatus !== 'concluido' && STATUS[p.prevStatus] ? p.prevStatus : openStatus(), true);
}

/* ---------- eventos ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const act = el.dataset.act, id = el.dataset.id;
  const admin = isAdmin();
  switch (act) {
    case 'toggle': UI.expanded.has(id) ? UI.expanded.delete(id) : UI.expanded.add(id); renderMain(); break;
    case 'view': UI.view = el.dataset.v; document.querySelectorAll('.seg button').forEach(b => b.classList.toggle('on', b.dataset.v === UI.view)); renderMain(); break;
    case 'fprio': UI.prio = !UI.prio; renderAll(); break;
    case 'fstatus': UI.status = UI.status === el.dataset.s ? null : el.dataset.s; renderAll(); break;
    case 'ftag': UI.tag = UI.tag === el.dataset.t ? null : el.dataset.t; renderAll(); break;
    case 'clear': UI.tag = UI.status = null; UI.prio = false; UI.search = ''; const s = $('#search'); if (s) s.value = ''; renderAll(); break;
    case 'gcollapse': { const g = el.dataset.g; UI.collapsed.has(g) ? UI.collapsed.delete(g) : UI.collapsed.add(g); renderMain(); break; }
    case 'theme': { const cur = document.documentElement.getAttribute('data-theme'); LS.set(THEME_KEY, cur === 'dark' ? 'light' : 'dark'); applyTheme(); el.innerHTML = cur === 'dark' ? I.moon : I.sun; break; }
    case 'logout': if (confirm('Sair do roadmap?')) logout(); break;
    case 'tv': enterTV(); break;
    case 'tvexit': exitTV(); break;
    case 'tvrotate': DB.settings.tvRotate = !DB.settings.tvRotate; if (admin) save(true); tvSpot = 0; renderTV(); break;
    case 'fs': toggleFullscreen(); break;
    case 'log': openLog(''); break;
    case 'plog': openLog(id); break;
    case 'tvlayout': { const i = TV_LAYOUTS.findIndex(x => x[0] === tvLayout()); LS.set(TVL_KEY, TV_LAYOUTS[(i + 1) % TV_LAYOUTS.length][0]); renderTV(); break; }
    case 'tvrecent': {
      if (!admin) break;
      const i = RECENT_OPTS.findIndex(x => x[0] === recentHours()); DB.settings.recentHours = RECENT_OPTS[(i + 1) % RECENT_OPTS.length][0];
      save(true); renderTV(); toast('Sinalizar alterações: ' + (DB.settings.recentHours ? 'últimas ' + DB.settings.recentHours + ' h' : 'desligado')); break;
    }
    case 'tlstyle': { const i = TL_STYLES.findIndex(x => x[0] === tlStyle()); LS.set(TLS_KEY, TL_STYLES[(i + 1) % TL_STYLES.length][0]); renderTV(); break; }

    case 'new': openProjectModal(null); break;

    case 'down': moveCard(id, 1); break;

    case 'unfeature': DB.featuredId = null; save(); renderMain(); break;

      const p = byId(id); if (!p) break;
      p.priority = !p.priority; logEv(p, 'prioridade', p.priority ? 'Marcado como prioridade' : 'Prioridade removida');
      save(); renderAll(); toast(p.priority ? 'Marcado como prioridade' : 'Prioridade removida'); break;
    }
    case 'kwtoggle': {
      if (!id) break; const p = byId(id), k = el.dataset.k;
      p.tags = p.tags.includes(k) ? p.tags.filter(t => t !== k) : [...p.tags, k];
      save(); renderAll(); break;
    }
    case 'edtask': UI.editTask = el.dataset.t; renderAll(); setTimeout(() => { const i = document.querySelector('.tedit .te-text'); if (i) { i.focus(); i.select(); } }, 30); break;
    case 'edtaskcancel': UI.editTask = null; renderAll(); break;
    case 'rmtask': {

document.addEventListener('change', e => {
  const el = e.target;
  if (el.matches('select[data-act="setstatus"]') && isAdmin()) {
    const p = byId(el.dataset.id); if (!p) return;
    let v = el.value;
    if (v === '__new') { v = newStatus(); if (!v) { el.value = p.status; return; } }
    setStatus(p, v, false); save(); renderAll(); toast('Status: ' + STATUS[v].label);
    return;
  }
  if (el.matches('select[data-act="setcat"]') && isAdmin()) {
    const p = byId(el.dataset.id); if (!p) return;
    let v = el.value;
    if (v === '__new') { v = newCategory(); if (!v) { el.value = p.groupId; return; } }
    p.groupId = v; logEv(p, 'categoria', groupOf(p).name); save(); renderAll(); toast('Categoria: ' + groupOf(p).name);
    return;
  }
  if (el.matches('input[data-act="task"]') && isAdmin()) {
    const p = byId(el.dataset.id), t = p && p.tasks.find(x => x.id === el.dataset.t); if (!t) return;
    t.done = el.checked; t.doneAt = t.done ? Date.now() : null;

    p[fld] = el.value;
    logEv(p, 'datas', (fld === 'start' ? 'Início' : 'Prazo') + ': ' + (old ? fmtDate(old) : '—') + ' → ' + (el.value ? fmtDate(el.value) : '—'));

});
document.addEventListener('submit', e => {
  const f = e.target;
  if (f.matches('form.kwadd') && isAdmin()) {
    e.preventDefault();
    const p = byId(f.dataset.id), inp = f.querySelector('input');
    const words = inp.value.split(',').map(x => x.trim()).filter(Boolean); if (!p || !words.length) return;
    words.forEach(w => { const ex = allTags().find(t => t.toLowerCase() === w.toLowerCase()) || w; if (!p.tags.includes(ex)) p.tags.push(ex); });
    save(); renderAll();
    const again = document.querySelector(`form.kwadd[data-id="${p.id}"] input`); if (again) again.focus();
    return;
  }
  if (f.matches('form.tedit') && isAdmin()) { e.preventDefault(); saveTaskEdit(f); return; }
  if (f.matches('form.addtask') && isAdmin()) {
    e.preventDefault();
    const inp = f.querySelector('input'), txt = inp.value.trim(); if (!txt) return;
    const p = byId(f.dataset.id); p.tasks.push({ id: uid(), text: txt, done: false, createdAt: Date.now() }); logEv(p, 'etapa_criada', txt); autoStatus(p); save(); renderAll();

});

/* ---------- modal ---------- */
let modalEl = null;
function openModal(title, body, foot, onMount) {
  closeModal();
  modalEl = document.createElement('div');
  modalEl.className = 'modal-back';
  modalEl.innerHTML = `<div class="modal" role="dialog" aria-modal="true"><div class="modal-head"><h2>${esc(title)}</h2><button class="icon-btn sm ghost" data-close title="Fechar">${I.x}</button></div><div class="modal-body">${body}</div>${foot ? `<div class="modal-foot">${foot}</div>` : ''}</div>`;
  // só fecha clicando fora se o clique COMEÇOU fora (selecionar texto e soltar fora não fecha mais)
  let downOnBack = false;
  modalEl.addEventListener('pointerdown', e => { downOnBack = e.target === modalEl; });
  modalEl.addEventListener('input', () => { modalEl.dataset.dirty = '1'; });
  modalEl.addEventListener('click', e => {
    if (e.target.closest('[data-close]')) return closeModal();
    if (e.target === modalEl && downOnBack) requestCloseModal();
  });
  document.body.appendChild(modalEl);
  if (onMount) onMount(modalEl);
}
function requestCloseModal() {
  if (!modalEl) return false;
  if (modalEl.dataset.dirty && !confirm('Descartar as alterações feitas nesta janela?')) return true;
  return closeModal();
}
function closeModal() { if (!modalEl) return false; modalEl.remove(); modalEl = null; return true; }

      e.preventDefault(); e.stopPropagation();
      const inp = e.target.querySelector('input');
      inp.value.split(',').map(x => x.trim()).filter(Boolean).forEach(w => { const ex = [...allTags(), ...kws].find(t => t.toLowerCase() === w.toLowerCase()) || w; if (!kws.includes(ex)) kws.push(ex); });
      inp.value = ''; paintKw(); inp.focus();
    });
    const gsel = m.querySelector('#f-group'); let gprev = gsel.value;
    gsel.addEventListener('change', () => {
      if (gsel.value !== '__new') { gprev = gsel.value; return; }
      const id = newCategory(); if (!id) { gsel.value = gprev; return; }
      save(); gsel.innerHTML = catOptions(id); gprev = id;
    });
    makeSortable(box, '.trow', '.tgrip', () => {});
    const ssel = m.querySelector('#f-status'); let sprev = ssel.value;
    ssel.addEventListener('change', () => {
      if (ssel.value !== '__new') { sprev = ssel.value; return; }
      const id = newStatus(); if (!id) { ssel.value = sprev; return; }
      save(); ssel.innerHTML = statusOptions(id); sprev = id;
    });
    const each = () => { const n = box.children.length; m.querySelector('#f-each').textContent = n ? `— cada etapa vale ${+(100 / n).toFixed(1)}%` : ''; };
    const row = t => { const d = document.createElement('div'); d.className = 'trow'; d.dataset.tid = t.id; d.innerHTML = `<button type="button" class="tgrip" title="Arraste para mudar a ordem">${I.grip}</button><input type="checkbox" ${t.done ? 'checked' : ''} title="Concluída"><input class="inp" value="${esc(t.text)}" placeholder="Descrição da etapa"><button type="button" class="icon-btn sm ghost" title="Remover">${I.x}</button>`; d.querySelector('button.icon-btn').onclick = () => { d.remove(); each(); }; box.appendChild(d); each(); return d; };
    p.tasks.forEach(row);
    m.querySelector('#f-add').onclick = () => row({ id: uid(), text: '', done: false }).querySelector('.inp').focus();
    m.querySelector('#f-name').focus();
    const del = m.querySelector('#f-del');
    if (del) del.onclick = () => { if (!confirm(`Excluir o projeto "${src.name}"?`)) return; logEv(src, 'projeto_excluido', ''); DB.projects = DB.projects.filter(x => x.id !== pid); if (DB.featuredId === pid) DB.featuredId = null; save(); closeModal(); renderAll(); toast('Projeto excluído'); };
    m.querySelector('#f-save').onclick = () => {
      const name = m.querySelector('#f-name').value.trim();
      if (!name) { m.querySelector('#f-name').focus(); return toast('Informe o nome do projeto'); }
      const now = Date.now(), target = src || p;
      const before = isNew ? null : JSON.parse(JSON.stringify(src));
      const oldT = Object.fromEntries((before ? before.tasks : []).map(t => [t.id, t]));
      const tasks = [...box.children].map(d => {
        const id = d.dataset.tid, o = oldT[id], done = d.querySelector('input[type=checkbox]').checked;
        return { id, text: d.querySelector('.inp').value.trim(), done, createdAt: o ? o.createdAt : now, doneAt: done ? (o && o.done ? o.doneAt : now) : null };
      }).filter(t => t.text);
      const newStatusV = m.querySelector('#f-status').value, notes = m.querySelector('#f-notes').value, prioV = m.querySelector('#f-prio').checked;
      if (!!target.priority !== prioV) { target.priority = prioV; if (!isNew || prioV) logEv(target, 'prioridade', prioV ? 'Marcado como prioridade' : 'Prioridade removida'); }
      Object.assign(target, {
        name, groupId: m.querySelector('#f-group').value,
        owner: m.querySelector('#f-owner').value.trim(), start: m.querySelector('#f-start').value, due: m.querySelector('#f-due').value,
        desc: m.querySelector('#f-desc').value.trim(), tags: kws, tasks
      });
      if (isNew) {
        target.createdAt = now; DB.projects.push(target); UI.expanded.add(target.id);
        logEv(target, 'projeto_criado', name);
        tasks.forEach(t => logEv(target, 'etapa_criada', t.text));
      } else {
        if (before.name !== name) logEv(target, 'projeto_editado', `Nome: ${before.name} → ${name}`);
        if (before.groupId !== target.groupId) logEv(target, 'categoria', groupOf(target).name);
        ['start', 'due'].forEach(fl => { if ((before[fl] || '') !== target[fl]) logEv(target, 'datas', (fl === 'start' ? 'Início' : 'Prazo') + ': ' + (before[fl] ? fmtDate(before[fl]) : '—') + ' → ' + (target[fl] ? fmtDate(target[fl]) : '—')); });
        tasks.forEach(t => { const o = oldT[t.id]; if (o && o.text !== t.text) logEv(target, 'etapa_editada', `Texto: "${o.text}" → "${t.text}"`); });
        { const kept = before.tasks.map(o => o.id).filter(id => tasks.some(t => t.id === id)), nowIds = tasks.map(t => t.id).filter(id => oldT[id]);
          logReorder(target, kept, nowIds, tasks); }
        tasks.forEach(t => { const o = oldT[t.id]; if (!o) logEv(target, 'etapa_criada', t.text); else if (o.done !== t.done) logEv(target, t.done ? 'etapa_concluida' : 'etapa_reaberta', t.text); });
        before.tasks.forEach(o => { if (!tasks.some(t => t.id === o.id)) logEv(target, 'etapa_removida', o.text); });
      }
      if ((target.notes || '') !== notes) { target.notes = notes; target.notesAt = now; target.notesBy = ME.name || ME.username; if (!isNew || notes.trim()) logEv(target, 'anotacoes', notes.trim() ? 'Anotações atualizadas' : 'Anotações apagadas'); }
      if (newStatusV !== target.status) setStatus(target, newStatusV, false);
      if (!(target.status === 'concluido' && target.tasks.length && progress(target) < 100)) autoStatus(target);
      target.updatedAt = now;
      const next = target;
      save(); closeModal(); renderAll(); toast(isNew ? 'Projeto criado' : 'Projeto salvo');
    };
  });
}

/* ---------- histórico ---------- */
function openLog(pid) {
  const ks = [['', 'Todos os tipos'], ['etapa_concluida', 'Etapas concluídas'], ['etapa_criada', 'Etapas criadas'], ['etapa_editada', 'Etapas editadas (texto, datas, ordem)'], ['projeto', 'Projetos (criado, concluído, status)'], ['datas', 'Datas'], ['anotacoes', 'Anotações']];
  const projs = [...DB.projects].sort((a, b) => a.name.localeCompare(b.name, 'pt-BR'));
  const p = pid ? byId(pid) : null;
  const body = `${p ? `<div class="lg-sum"><h3>${esc(p.name)}</h3>${datesHTML(p) || '<p class="muted" style="margin:0 0 8px;font-size:13px">Sem datas definidas.</p>'}${(p.notes || '').trim() ? `<div class="notes" style="margin:0"><div class="notes-h"><b>Anotações</b><span class="notes-at">${notesInfo(p)}</span></div><div class="notes-ro">${esc(p.notes)}</div></div>` : ''}</div>` : ''}
    <div class="lg-filters">
      <select class="inp" id="lg-p"><option value="">Todos os projetos</option>${projs.map(x => `<option value="${x.id}" ${x.id === pid ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select>
      <select class="inp" id="lg-k">${ks.map(([v, l]) => `<option value="${v}">${l}</option>`).join('')}</select>
      <input class="inp" id="lg-q" type="search" placeholder="Buscar no histórico">
    </div>
    <div id="lg-list"></div>`;
  const foot = `<button class="btn" id="lg-csv">${I.download}Exportar planilha (.csv)</button><span class="spacer"></span><button class="btn" data-close>Fechar</button>`;
  openModal(p ? 'Histórico do projeto' : 'Histórico', body, foot, m => {
    let limit = 300;
    const q = s => m.querySelector(s);
    const filtered = () => {
      const fp = q('#lg-p').value, fk = q('#lg-k').value, fq = q('#lg-q').value.trim().toLowerCase();
      return DB.log.filter(e => (!fp || e.pid === fp) &&
        (!fk || (fk === 'etapa_editada' ? /^etapa_(editada|ordem)$/.test(e.k) : fk === 'projeto' ? /^projeto_|^status$|^categoria$/.test(e.k) : e.k === fk)) &&
        (!fq || [e.pn, e.t, e.u, (LOG_KINDS[e.k] || {}).label].join(' ').toLowerCase().includes(fq))).reverse();
    };
    const paint = () => {
      const all = filtered(), list = all.slice(0, limit);
      if (!list.length) { q('#lg-list').innerHTML = `<div class="empty">Nenhum registro${DB.log.length ? ' com esses filtros' : ' ainda. A partir de agora, cada etapa criada ou concluída, mudança de status, datas e anotações fica registrada aqui'}.</div>`; return; }
      let day = '', html = '';
      list.forEach(e => {
        const d = new Date(e.ts), key = d.toDateString();
        if (key !== day) { day = key; html += `<div class="lg-day">${d.toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: '2-digit', year: 'numeric' })}</div>`; }
        const kd = LOG_KINDS[e.k] || { label: e.k, color: '#64748b' };
        html += `<div class="lg-row"><span class="lg-time">${fmtHM(e.ts)}</span><div><span class="lg-k" style="--s:${kd.color}">${kd.label}</span>${q('#lg-p').value ? '' : `<b>${esc(e.pn)}</b>${e.t ? ' · ' : ''}`}${esc(e.t)}${e.u ? ` <span class="lg-u">· ${esc(e.u)}</span>` : ''}</div></div>`;
      });
      if (all.length > limit) html += `<div style="text-align:center;margin-top:12px"><button class="btn mini" id="lg-more">Mostrar mais (${all.length - limit})</button></div>`;
      q('#lg-list').innerHTML = html;
      const more = q('#lg-more'); if (more) more.onclick = () => { limit += 300; paint(); };
    };
    ['#lg-p', '#lg-k'].forEach(s => q(s).addEventListener('change', () => { limit = 300; paint(); }));
    q('#lg-q').addEventListener('input', () => { limit = 300; paint(); });
    q('#lg-csv').onclick = () => {
      const cell = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
      const rows = [['Data', 'Hora', 'Projeto', 'Tipo', 'Descrição', 'Usuário']].concat(filtered().reverse().map(e => {
        const d = new Date(e.ts); return [d.toLocaleDateString('pt-BR'), fmtHM(e.ts), e.pn, (LOG_KINDS[e.k] || {}).label || e.k, e.t, e.u];
      }));
      download(slug(DB.settings.title) + '-historico-' + todayISO() + '.csv', '\ufeff' + rows.map(r => r.map(cell).join(';')).join('\r\n'), 'text/csv');
    };
    paint();
    delete modalEl.dataset.dirty;
  });
  modalEl.addEventListener('input', () => { delete modalEl.dataset.dirty; });
}

    ];

    body += `<p class="note">Escolha um design para ver na hora, aqui e no modo TV. A escolha vale para todos que usarem este arquivo. Os temas claro e escuro continuam funcionando, exceto no Grafite, que é sempre escuro.</p>
      <div class="design-grid">${D.map(([k, n, d, bg, c]) => `<button class="design-opt ${k === cur ? 'on' : ''}" data-design-opt="${k}"><div class="design-sw" style="background:${bg}"><i style="left:12%;top:42%;width:46%;height:10px;border-radius:5px;background:${c[0]}"></i><i style="left:12%;top:64%;width:70%;height:14px;border-radius:4px;background:${c[1]};opacity:.9"></i></div><b>${n}</b><small>${d}</small></button>`).join('')}</div>`;

        r.innerHTML = `<button type="button" class="tgrip" title="Arraste para mudar a ordem">${I.grip}</button><input type="color" value="${STATUS_COLORS.find(c => !used.has(c)) || STATUS_COLORS[0]}"><input class="inp" placeholder="Nome do status"><span class="muted" style="font-size:12px;white-space:nowrap">0 proj.</span><button class="icon-btn sm ghost" data-rms title="Excluir status">${I.trash}</button>`;

    if (e.target.closest('[data-pvx]')) { closePv(); return; }
